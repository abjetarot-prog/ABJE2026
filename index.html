<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot - Gestion de Club</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1a1a2e;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent3: #8b5cf6;
      --accent4: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    nav {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0;
    }

    .nav-tab {
      flex: 1;
      padding: 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .nav-tab.active {
      color: var(--accent1);
      border-bottom: 2px solid var(--accent1);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }

    .qr-code img {
      display: block;
      margin: 1rem auto;
      border-radius: 0.75rem;
      border: 4px solid var(--border);
    }

    h1, h2, h3 {
      margin: 0 0 1rem 0;
      color: var(--text);
    }

    h2 {
      font-size: 1.25rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent1);
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin: 0.25rem;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent2);
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .player-card {
      background: var(--bg);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--border);
    }

    .player-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .player-status {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .error {
      color: var(--accent2);
      margin: 0.5rem 0;
    }

    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
    }

    .login-icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <span>ABJE Tarot</span>
    </div>
    <button id="logout-btn" class="secondary" style="display: none;">Déconnexion</button>
  </header>

  <nav id="nav-tabs" style="display: none;">
    <button class="nav-tab active" data-tab="accueil">🏠 Accueil</button>
    <button class="nav-tab" data-tab="joueurs">👥 Joueurs</button>
    <button class="nav-tab" data-tab="tables">🎲 Tables</button>
    <button class="nav-tab" data-tab="saisie">✏️ Saisie</button>
    <button class="nav-tab" data-tab="resultats">🏆 Résultats</button>
  </nav>

  <main id="app"></main>

  <script>
    // ========== DONNÉES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "1", nom: "Joueur 1", disponible: false },
      { id: "2", nom: "Joueur 2", disponible: false },
      { id: "3", nom: "Joueur 3", disponible: false },
      { id: "4", nom: "Joueur 4", disponible: false }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];
    let menes = JSON.parse(localStorage.getItem("abje_menes")) || {};
    let tableCounter = parseInt(localStorage.getItem("abje_tableCounter") || "0");

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables));
      localStorage.setItem("abje_menes", JSON.stringify(menes));
      localStorage.setItem("abje_tableCounter", tableCounter);
    }

    // ========== FONCTIONS UTILITAIRES ==========
    function formatDateFR(date) {
      if (typeof date === "string") date = new Date(date);
      return date.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
    }

    function dateKey(date) {
      if (typeof date === "string") return date;
      return date.toISOString().split("T")[0];
    }

    // ========== RENDU DES ÉCRANS ==========
    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <div class="login-container">
          <div class="login-icon">🃏</div>
          <h1>ABJE Tarot</h1>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Gestion de club de Tarot</p>

          <form id="loginForm">
            <input type="text" id="login" placeholder="Login (admin/abje)" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <div id="loginError" class="error"></div>
            <button type="submit" style="width: 100%;">Se connecter</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const login = document.getElementById("login").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("loginError");

        if ((login === "admin" && password === ADMIN_PASSWORD) ||
            (login === "abje" && password === ABJE_PASSWORD)) {
          user = { role: login };
          errorEl.textContent = "";
          saveData();
          renderApp();
        } else {
          errorEl.textContent = "Login ou mot de passe incorrect";
        }
      });
    }

   function renderApp() {
  if (!user) {
    renderLogin();
    document.getElementById("nav-tabs").style.display = "none";
    document.getElementById("logout-btn").style.display = "none";
  } else {
    document.getElementById("nav-tabs").style.display = "flex";
    document.getElementById("logout-btn").style.display = "block";
    
    // CORRECTION : Attacher les événements des onglets
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.onclick = () => showTab(tab.dataset.tab);
    });
    
    // CORRECTION : Attacher l'événement de déconnexion
    document.getElementById("logout-btn").onclick = () => {
      user = null;
      saveData();
      renderApp();
    };
    
    renderContent("accueil");
  }
}

    function copyLink() {
      navigator.clipboard.writeText(APP_URL).then(() => alert("Lien copié !"));
    }

    function renderJoueurs() {
      document.getElementById("app").innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>👥 Joueurs</h2>
            <button onclick="showAddJoueur()">+ Ajouter</button>
          </div>

          <div class="player-grid">
            ${joueurs.map(j => `
              <div class="player-card">
                <div class="player-name">${j.nom}</div>
                <div class="player-status">${j.disponible ? "✅ Disponible" : "❌ Non disponible"}</div>
                <div style="margin-top: 0.5rem;">
                  <button class="secondary" onclick="toggleDispo('${j.id}')" style="padding: 0.25rem 0.5rem;">
                    ${j.disponible ? "Retirer" : "Ajouter"}
                  </button>
                  <button onclick="deleteJoueur('${j.id}')" style="padding: 0.25rem 0.5rem; background: var(--accent2);">×</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTables() {
      document.getElementById("app").innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>🎲 Tables</h2>
            <button onclick="showCreateTable()">+ Nouvelle table</button>
          </div>

          ${tables.length === 0 ? `
            <div class="card">Aucune table créée.</div>
          ` : `
            ${tables.map(t => `
              <div class="card">
                <h3>Table n°${t.numero} (${t.nbJoueurs} joueurs)</h3>
                <p>Joueurs: ${t.joueursAffectes ? t.joueursAffectes.length : 0}/${t.nbJoueurs}</p>
                <button onclick="deleteTable('${t.id}')" style="background: var(--accent2);">Supprimer</button>
              </div>
            `).join('')}
          `}
        </div>
      `;
    }

    function renderSaisie() {
      document.getElementById("app").innerHTML = `
        <div class="card">
          <h2>✏️ Saisie des résultats</h2>
          <p>Fonctionnalité à implémenter (votre ancienne version était ici).</p>
        </div>
      `;
    }

    function renderResultats() {
      document.getElementById("app").innerHTML = `
        <div class="card">
          <h2>🏆 Résultats</h2>
          <p>Fonctionnalité à implémenter (votre ancienne version était ici).</p>
        </div>
      `;
    }

    // ========== MODALES ==========
    function showAddJoueur() {
      const nom = prompt("Nom du nouveau joueur :");
      if (nom) {
        joueurs.push({ id: Date.now().toString(), nom, disponible: false });
        saveData();
        renderJoueurs();
      }
    }

    function showCreateTable() {
      const nbJoueurs = prompt("Nombre de joueurs (4-7) :");
      if (nbJoueurs && [4,5,6,7].includes(parseInt(nbJoueurs))) {
        tableCounter++;
        tables.push({
          id: Date.now().toString(),
          numero: tableCounter,
          nbJoueurs: parseInt(nbJoueurs),
          joueursAffectes: []
        });
        saveData();
        renderTables();
      }
    }

    // ========== FONCTIONS DE GESTION ==========
    function toggleDispo(id) {
      joueurs = joueurs.map(j => j.id === id ? { ...j, disponible: !j.disponible } : j);
      saveData();
      renderJoueurs();
    }

    function deleteJoueur(id) {
      if (confirm("Supprimer ce joueur ?")) {
        joueurs = joueurs.filter(j => j.id !== id);
        saveData();
        renderJoueurs();
      }
    }

    function deleteTable(id) {
      if (confirm("Supprimer cette table ?")) {
        tables = tables.filter(t => t.id !== id);
        saveData();
        renderTables();
      }
    }

    function showTab(tab) {
  // CORRECTION : Retirer la classe active de tous les onglets
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  
  // CORRECTION : Ajouter la classe active à l'onglet cliqué
  const activeTab = document.querySelector(`[data-tab="${tab}"]`);
  if (activeTab) activeTab.classList.add('active');
  
  // CORRECTION : Charger le contenu de l'onglet
  renderContent(tab);
}

    function renderContent(tab) {
  const contentMap = {
    accueil: renderAccueil,
    joueurs: renderJoueurs,
    tables: renderTables,
    saisie: renderSaisie,
    resultats: renderResultats
  };

  // CORRECTION : Vérifier que la fonction existe avant de l'appeler
  if (contentMap[tab]) {
    contentMap[tab]();
  } else {
    console.error(`Onglet "${tab}" non trouvé.`);
  }
}

    function renderApp() {
      if (!user) {
        renderLogin();
        document.getElementById("nav-tabs").style.display = "none";
        document.getElementById("logout-btn").style.display = "none";
      } else {
        document.getElementById("nav-tabs").style.display = "flex";
        document.getElementById("logout-btn").style.display = "block";
        document.getElementById("logout-btn").onclick = () => {
          user = null;
          saveData();
          renderApp();
        };
        renderContent("accueil");
      }
    }

    // ========== INITIALISATION ==========
    renderApp();
  </script>
</body>
</html>
