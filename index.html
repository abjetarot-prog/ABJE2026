<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    h1, h2, h3 {
      margin: 0 0 1rem 0;
      color: var(--text);
      font-weight: 700;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin: 0.5rem 0;
    }
    .error {
      color: var(--accent2);
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
    }
    .login-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <span>ABJE Tarot</span>
    </div>
    <button id="logout-btn" class="btn-ghost" style="display: none;">Déconnexion</button>
  </header>

  <main id="app">
    <!-- Le contenu sera généré par JavaScript -->
  </main>

  <script>
    // ========== CONSTANTES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "1", nom: "Tarot ABJE", disponible: false },
      { id: "2", nom: "Joueur 2", disponible: false },
      { id: "3", nom: "Joueur 3", disponible: false },
      { id: "4", nom: "Joueur 4", disponible: false }
    ];

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
    }

    // ========== RENDU ==========
    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <div class="login-container">
          <div class="login-icon">🃏</div>
          <h1>ABJE Tarot</h1>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Gestion de club de Tarot</p>
          <form id="loginForm">
            <input type="text" id="login" placeholder="Login (admin/abje)" required autocomplete="username">
            <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
            <div id="loginError" class="error"></div>
            <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = function(e) {
        e.preventDefault();
        const login = document.getElementById("login").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("loginError");

        if ((login === "admin" && password === ADMIN_PASSWORD) || (login === "abje" && password === ABJE_PASSWORD)) {
          user = { role: login };
          errorEl.textContent = "";
          saveData();
          renderApp();
        } else {
          errorEl.textContent = "Login ou mot de passe incorrect";
        }
      };
    }

    function renderApp() {
      if (!user) {
        renderLogin();
        document.getElementById("logout-btn").style.display = "none";
      } else {
        document.getElementById("logout-btn").style.display = "block";
        document.getElementById("logout-btn").onclick = function() {
          user = null;
          saveData();
          renderApp();
        };
        document.getElementById("app").innerHTML = `
          <div class="card" style="text-align: center;">
            <h2>Bienvenue sur ABJE Tarot !</h2>
            <p>Connecté en tant que ${user.role}</p>
            <button onclick="showTab('joueurs')" class="btn-primary">Aller aux joueurs</button>
          </div>
        `;
      }
    }

    // ========== INITIALISATION ==========
    // CORRECTION: Utiliser DOMContentLoaded pour s'assurer que le DOM est prêt
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderApp);
    } else {
      renderApp();
    }
  </script>
</body>
</html>
