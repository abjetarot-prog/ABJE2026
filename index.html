<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent4: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1, h2, h3 {
      margin: 0 0 16px 0;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    .btn-primary { background: var(--accent1); color: white; }
    .btn-success { background: var(--accent4); color: white; }
    .btn-danger { background: var(--accent2); color: white; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input, select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      margin-bottom: 12px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .error { color: var(--accent2); margin: 10px 0; font-size: 14px; }
    .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .player-card {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-info { flex: 1; }
    .player-name { font-weight: 600; font-size: 16px; }
    .player-status { font-size: 14px; color: var(--text-muted); }
    .player-score { font-weight: 600; font-size: 18px; }
    .positive { color: var(--accent4); }
    .negative { color: var(--accent2); }
    .qr-code img { border-radius: 12px; border: 4px solid var(--border); margin: 20px 0; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .user-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent1);
      font-weight: 600;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }
    .nav-tab {
      padding: 10px 16px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      font-weight: 600;
    }
    .nav-tab.active { background: rgba(139, 92, 246, 0.2); color: white; }
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-row > div { flex: 1; min-width: 150px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { font-weight: 600; color: var(--text-muted); }
    .table-container { overflow-x: auto; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🃏 ABJE Tarot</h1>
      <div id="user-section"></div>
    </header>

    <nav class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-tab="accueil">🏠 Accueil</button>
      <button class="nav-tab" data-tab="joueurs">👥 Joueurs</button>
      <button class="nav-tab" data-tab="tables">🎲 Tables</button>
      <button class="nav-tab" data-tab="saisie">📝 Saisie</button>
      <button class="nav-tab" data-tab="resultats">🏆 Résultats</button>
      <button class="nav-tab" data-tab="saisons" id="saisons-tab">📅 Saisons</button>
    </nav>

    <main id="main-content"></main>
  </div>

  <!-- Modal pour créer une table -->
  <div id="create-table-modal" class="modal">
    <div class="modal-content">
      <h2>Créer une nouvelle table</h2>
      <div class="form-group">
        <label>Nombre de joueurs</label>
        <select id="new-table-nb-joueurs">
          <option value="4">4 joueurs</option>
          <option value="5">5 joueurs</option>
          <option value="6">6 joueurs</option>
          <option value="7">7 joueurs</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sélectionnez les joueurs présents aujourd'hui</label>
        <div id="new-table-joueurs-select" class="checkbox-group"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn-primary" onclick="createTable()">Créer la table</button>
        <button class="btn-ghost" onclick="hideCreateTableModal()">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Modal pour créer une saison -->
  <div id="create-saison-modal" class="modal">
    <div class="modal-content">
      <h2>Créer une nouvelle saison</h2>
      <div class="form-group">
        <label>Nom de la saison</label>
        <input type="text" id="new-saison-nom" placeholder="Ex: Saison 2026-2027" required />
      </div>
      <div class="form-group">
        <label>Date de début</label>
        <input type="date" id="new-saison-date" required />
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn-primary" onclick="createSaison()">Créer la saison</button>
        <button class="btn-ghost" onclick="hideCreateSaisonModal()">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    // ========== CONSTANTES ==========
    const VALID_USERS = {
      admin: "Tass6gny",
      abje: "0309"
    };

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "j1", nom: "Tarot ABJE", scoreTotal: 0 },
      { id: "j2", nom: "Joueur 2", scoreTotal: 0 },
      { id: "j3", nom: "Joueur 3", scoreTotal: 0 },
      { id: "j4", nom: "Joueur 4", scoreTotal: 0 }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];
    let saisons = JSON.parse(localStorage.getItem("abje_saisons")) || [];
    let resultats = JSON.parse(localStorage.getItem("abje_resultats")) || [];
    let joueursPresents = JSON.parse(localStorage.getItem("abje_joueurs_presents")) || [];

    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables));
      localStorage.setItem("abje_saisons", JSON.stringify(saisons));
      localStorage.setItem("abje_resultats", JSON.stringify(resultats));
      localStorage.setItem("abje_joueurs_presents", JSON.stringify(joueursPresents));
    }

    // ========== FONCTIONS UTILITAIRES ==========
    function formatDateFR(d) {
      if (typeof d === "string") d = new Date(d);
      return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }

    function getInitials(nom) {
      return nom.split(" ").map(n => n[0].toUpperCase()).join("");
    }

    function formatScore(score) {
      return score >= 0 ? `+${score}` : score;
    }

    // ========== FONCTIONS DE CALCUL (Règles FFTarot) ==========
    function calculerScore(mene, nbJoueurs) {
      const contrats = { "Petite": 1, "Garde": 2, "Garde sans": 4, "Garde contre": 6 };
      const seuils = { 0: 56, 1: 51, 2: 41, 3: 36 };
      const mult = contrats[mene.contrat] || 1;
      const seuil = seuils[mene.nbBouts || 0] || 56;
      const diff = (mene.points || 0) - seuil;

      let base = 25 + diff;
      if (mene.petitAuBout === "preneur") base += 10;
      else if (mene.petitAuBout === "defense") base -= 10;

      let score = Math.round((base * mult) / 10) * 10;
      const poigneePts = { "Aucune": 0, "Simple": 20, "Double": 30, "Triple": 40 }[mene.poignee] || 0;
      score += (mene.poigneeSide === "preneur" ? poigneePts : -poigneePts);
      score += { "Aucun": 0, "Non demandé": 200, "Demandé réussi": 400, "Demandé perdu": -400 }[mene.chelem] || 0;
      const gagne = diff >= 0;

      // Répartition des scores selon le nombre de joueurs
      const scores = {};
      if (nbJoueurs === 4) {
        // 1 preneur contre 3 défenseurs
        const preneurId = mene.preneur;
        scores[preneurId] = gagne ? score * 3 : -score * 3;
        joueurs.filter(j => j.id !== preneurId).forEach(j => {
          scores[j.id] = gagne ? -score : score;
        });
      } else if (nbJoueurs === 5) {
        // 1 preneur + 1 appelé contre 3 défenseurs
        const preneurId = mene.preneur;
        const appeleId = mene.appele || joueursPresents.find(j => j.id !== preneurId).id;
        scores[preneurId] = gagne ? score * 2 : -score * 2;
        scores[appeleId] = gagne ? score : -score;
        joueurs.filter(j => j.id !== preneurId && j.id !== appeleId).forEach(j => {
          scores[j.id] = gagne ? -score : score;
        });
      } else if (nbJoueurs === 6 || nbJoueurs === 7) {
        // 2 preneurs (ou 3 pour 7 joueurs) contre les autres
        const preneurs = [mene.preneur];
        if (mene.appele) preneurs.push(mene.appele);
        if (nbJoueurs === 7 && mene.appele2) preneurs.push(mene.appele2);

        const nbPreneurs = preneurs.length;
        const nbDefenseurs = nbJoueurs - nbPreneurs;

        preneurs.forEach(id => {
          scores[id] = gagne ? Math.round(score * nbDefenseurs / nbPreneurs) : -Math.round(score * nbDefenseurs / nbPreneurs);
        });

        joueurs.filter(j => !preneurs.includes(j.id)).forEach(j => {
          scores[j.id] = gagne ? -Math.round(score * nbPreneurs / nbDefenseurs) : Math.round(score * nbPreneurs / nbDefenseurs);
        });
      }

      return {
        preneur: gagne ? score : -score,
        defense: gagne ? -score : score,
        gagne,
        details: `${base} x ${mult} = ${score}${poigneePts ? ` + Poignée (${poigneePts})` : ""}${gagne ? " ✅" : " ❌"}`,
        scoresParJoueur: scores
      };
    }

    // ========== RENDU DES ONGLETS ==========
    function renderLoginScreen() {
      return `
        <div class="card" style="text-align: center; max-width: 400px; margin: 0 auto;">
          <div style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, var(--accent1), var(--accent2)); margin-bottom: 16px;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C12 2 8 6 8 10C8 12 9.5 13 12 13C14.5 13 16 12 16 10C16 6 12 2 12 2Z" fill="white" opacity="0.95" />
              <path d="M5 14C5 14 2 16 2 19C2 21 3.5 22 5 22C7 22 8 21 8 19C8 16 5 14 5 14Z" fill="white" opacity="0.8" />
              <path d="M19 14C19 14 16 16 16 19C16 21 17.5 22 19 22C21 22 22 21 22 19C22 16 19 14 19 14Z" fill="white" opacity="0.8" />
              <rect x="10.5" y="12" width="3" height="9" rx="1.5" fill="white" />
            </svg>
          </div>
          <h1>ABJE Tarot</h1>
          <p style="margin: 10px 0; font-size: 14px; color: var(--text-muted);">Gestion Club de Tarot</p>
          <form id="login-form" style="margin-top: 20px;">
            <div class="form-group">
              <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">Login</label>
              <input type="text" id="login" placeholder="admin ou abje" required />
            </div>
            <div class="form-group">
              <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">Mot de passe</label>
              <input type="password" id="password" placeholder="Mot de passe" required />
            </div>
            <div id="login-error" class="error"></div>
            <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
          </form>
        </div>
      `;
    }

    function renderAccueil() {
      return `
        <div class="card" style="text-align: center;">
          <h2>Bienvenue sur ABJE Tarot !</h2>
          <p>Scannez le QR code pour accéder à l'application depuis votre mobile :</p>
          <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(APP_URL)}&bgcolor=1e293b&color=f8fafc" alt="QR Code ABJE Tarot" width="200" height="200" />
          </div>
          <p><a href="${APP_URL}" target="_blank" style="color: var(--accent4);">${APP_URL}</a></p>
          <button class="btn-ghost" onclick="copyLink()">Copier le lien</button>
        </div>
      `;
    }

    function renderJoueurs() {
      return `
        <div class="card" style="text-align: left;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>Joueurs (${joueurs.length})</h2>
            ${(user?.role === "admin" || user?.role === "abje") ? `
              <form onsubmit="addJoueur(event)" style="display: flex; gap: 8px;">
                <input name="nom" type="text" placeholder="Nouveau joueur" style="width: 200px;" required />
                <button type="submit" class="btn-success">+ Ajouter</button>
              </form>
            ` : ''}
          </div>
          <div style="margin-bottom: 16px;">
            <h3>Présents aujourd'hui (${joueursPresents.length})</h3>
            <div class="player-grid">
              ${joueursPresents.map(j => `
                <div class="player-card">
                  <div class="player-info">
                    <div class="player-name">${j.nom}</div>
                    <div class="player-status">✅ Présent</div>
                  </div>
                  <div>
                    <span class="player-score ${j.scoreTotal >= 0 ? 'positive' : 'negative'}">${formatScore(j.scoreTotal)}</span>
                    ${(user?.role === "admin" || user?.role === "abje") ? `
                      <button class="btn-danger" onclick="removePresent('${j.id}')" style="padding: 4px 8px; margin-left: 8px;">Retirer</button>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div>
            <h3>Tous les joueurs</h3>
            <div class="player-grid">
              ${joueurs.map(j => `
                <div class="player-card">
                  <div class="player-info">
                    <div class="player-name">${j.nom}</div>
                    <div class="player-status">${joueursPresents.some(p => p.id === j.id) ? "✅ Présent" : "❌ Absent"}</div>
                  </div>
                  <div>
                    <span class="player-score ${j.scoreTotal >= 0 ? 'positive' : 'negative'}">${formatScore(j.scoreTotal)}</span>
                    ${(user?.role === "admin" || user?.role === "abje") ? `
                      <button class="btn-ghost" onclick="togglePresence('${j.id}')" style="padding: 4px 8px; margin-left: 8px;">
                        ${joueursPresents.some(p => p.id === j.id) ? "Retirer" : "Ajouter"}
                      </button>
                      <button class="btn-danger" onclick="deleteJoueur('${j.id}')" style="padding: 4px 8px; margin-left: 4px;">🗑️</button>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderTables() {
      return `
        <div class="card" style="text-align: left;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>Tables (${tables.length})</h2>
            ${(user?.role === "admin" || user?.role === "abje") ? `
              <button class="btn-primary" onclick="showCreateTableModal()">+ Nouvelle table</button>
            ` : ''}
          </div>
          ${tables.length === 0 ? '<p style="color: var(--text-muted); text-align: center;">Aucune table créée.</p>' : `
            ${tables.map(t => `
              <div style="margin-top: 10px; padding: 16px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                  <p style="margin: 0; font-weight: 600;">Table du ${formatDateFR(t.date)} (${t.nbJoueurs} joueurs)</p>
                  <span style="font-size: 14px; color: var(--text-muted);">${t.menes?.length || 0} ménes</span>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                  ${t.joueurs?.map(jId => {
                    const j = joueurs.find(j => j.id === jId);
                    return j ? `<span style="padding: 6px 12px; background: var(--card-bg); border-radius: 20px; font-size: 12px; color: var(--text-muted);">${getInitials(j.nom)}</span>` : '';
                  }).join('')}
                </div>
                ${(user?.role === "admin" || user?.role === "abje") ? `
                  <div style="display: flex; gap: 8px;">
                    <button class="btn-ghost" onclick="viewTable('${t.id}')" style="padding: 6px 12px; font-size: 12px;">Voir les ménes</button>
                    <button class="btn-danger" onclick="deleteTable('${t.id}')" style="padding: 6px 12px; font-size: 12px;">Supprimer</button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          `}
        </div>
      `;
    }

    function renderSaisie() {
      if (!user) return `<div class="card">Veuillez vous connecter.</div>`;
      if (joueursPresents.length < 4) return `<div class="card">Veuillez sélectionner au moins 4 joueurs présents pour créer une table.</div>`;

      return `
        <div class="card" style="text-align: left;">
          <h2>Saisie des résultats</h2>
          <div class="form-group">
            <label>Sélectionnez une table</label>
            <select id="saisie-table-select" onchange="loadTableMenes(this.value)">
              <option value="">-- Sélectionnez une table --</option>
              ${tables.map(t => `<option value="${t.id}">Table du ${formatDateFR(t.date)} (${t.nbJoueurs} joueurs)</option>`).join('')}
            </select>
          </div>
          <div id="saisie-mene-form" style="display: none;">
            <div class="form-group">
              <label>Preneur</label>
              <select id="saisie-preneur">
                <option value="">-- Sélectionnez le preneur --</option>
                ${joueursPresents.map(j => `<option value="${j.id}">${j.nom}</option>`).join('')}
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Contrat</label>
                <select id="saisie-contrat">
                  <option value="Petite">Petite</option>
                  <option value="Garde">Garde</option>
                  <option value="Garde sans">Garde sans le chien</option>
                  <option value="Garde contre">Garde contre le chien</option>
                </select>
              </div>
              <div class="form-group">
                <label>Points réalisés</label>
                <input type="number" id="saisie-points" placeholder="Points" min="0" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Petit au bout</label>
                <select id="saisie-petit">
                  <option value="aucun">Aucun</option>
                  <option value="preneur">Preneur</option>
                  <option value="defense">Défense</option>
                </select>
              </div>
              <div class="form-group">
                <label>Poignée</label>
                <select id="saisie-poignee">
                  <option value="Aucune">Aucune</option>
                  <option value="Simple">Simple</option>
                  <option value="Double">Double</option>
                  <option value="Triple">Triple</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Côté poignée</label>
                <select id="saisie-poignee-side">
                  <option value="preneur">Preneur</option>
                  <option value="defense">Défense</option>
                </select>
              </div>
              <div class="form-group">
                <label>Chelem</label>
                <select id="saisie-chelem">
                  <option value="Aucun">Aucun</option>
                  <option value="Non demandé">Non demandé</option>
                  <option value="Demandé réussi">Demandé réussi</option>
                  <option value="Demandé perdu">Demandé perdu</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Nombre de bouts</label>
              <select id="saisie-nb-bouts">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>
            ${joueursPresents.length >= 5 ? `
              <div class="form-group">
                <label>Appelé</label>
                <select id="saisie-appele">
                  <option value="">Aucun</option>
                  ${joueursPresents.map(j => `<option value="${j.id}">${j.nom}</option>`).join('')}
                </select>
              </div>
            ` : ''}
            ${joueursPresents.length >= 7 ? `
              <div class="form-group">
                <label>2ème Appelé</label>
                <select id="saisie-appele2">
                  <option value="">Aucun</option>
                  ${joueursPresents.map(j => `<option value="${j.id}">${j.nom}</option>`).join('')}
                </select>
              </div>
            ` : ''}
            <button class="btn-success" onclick="saveMene()">Enregistrer la mène</button>
            <div id="mene-result" style="margin-top: 16px; padding: 12px; background: var(--bg); border-radius: 8px; display: none;"></div>
          </div>
        </div>
      `;
    }

    function renderResultats() {
      return `
        <div class="card" style="text-align: left;">
          <h2>Résultats (${resultats.length})</h2>
          ${resultats.length === 0 ? '<p style="color: var(--text-muted); text-align: center;">Aucun résultat enregistré.</p>' : `
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Table</th>
                    <th>Preneur</th>
                    <th>Contrat</th>
                    <th>Points</th>
                    <th>Résultat</th>
                    <th>Score</th>
                  </tr>
                </thead>
                <tbody>
                  ${resultats.map(r => {
                    const table = tables.find(t => t.id === r.tableId);
                    const preneur = joueurs.find(j => j.id === r.preneur);
                    const score = calculerScore(r, table?.nbJoueurs || 4);
                    return `
                      <tr>
                        <td>${formatDateFR(r.date)}</td>
                        <td>${table ? formatDateFR(table.date) : "Inconnu"}</td>
                        <td>${preneur ? preneur.nom : "Inconnu"}</td>
                        <td>${r.contrat}</td>
                        <td>${r.points}</td>
                        <td>${score.gagne ? "✅ Gagné" : "❌ Perdu"}</td>
                        <td>${score.preneur >= 0 ? "+" : ""}${score.preneur}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function renderSaisons() {
      if (user?.role !== "admin") return `<div class="card">Accès réservé à l'admin.</div>`;

      return `
        <div class="card" style="text-align: left;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>Saisons (${saisons.length})</h2>
            <button class="btn-primary" onclick="showCreateSaisonModal()">+ Nouvelle saison</button>
          </div>
          ${saisons.length === 0 ? '<p style="color: var(--text-muted); text-align: center;">Aucune saison créée.</p>' : `
            ${saisons.map(s => `
              <div style="margin-top: 10px; padding: 16px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                  <h3>${s.nom}</h3>
                  <span style="font-size: 14px; color: var(--text-muted);">Début: ${formatDateFR(s.dateDebut)}</span>
                </div>
                <p>Tables: ${s.tables?.length || 0}</p>
                <div style="display: flex; gap: 8px;">
                  <button class="btn-ghost" onclick="viewSaison('${s.id}')" style="padding: 6px 12px; font-size: 12px;">Voir les détails</button>
                  <button class="btn-danger" onclick="deleteSaison('${s.id}')" style="padding: 6px 12px; font-size: 12px;">Supprimer</button>
                </div>
              </div>
            `).join('')}
          `}
        </div>
      `;
    }

    // ========== FONCTIONS ==========
    function login(e) {
      e.preventDefault();
      const loginInput = document.getElementById("login").value.trim();
      const passwordInput = document.getElementById("password").value;
      const errorElement = document.getElementById("login-error");

      const login = loginInput.toLowerCase();
      const password = passwordInput;

      if (login === "admin" && password === VALID_USERS.admin) {
        user = { role: "admin", login: "admin" };
        errorElement.textContent = "";
        saveData();
        renderApp();
      } else if (login === "abje" && password === VALID_USERS.abje) {
        user = { role: "abje", login: "abje" };
        errorElement.textContent = "";
        saveData();
        renderApp();
      } else {
        errorElement.textContent = "Login ou mot de passe incorrect";
      }
    }

    function logout() {
      user = null;
      saveData();
      renderApp();
    }

    function addJoueur(e) {
      e.preventDefault();
      const nom = e.target.nom.value.trim();
      if (nom) {
        joueurs.push({ id: Date.now().toString(), nom, scoreTotal: 0 });
        saveData();
        renderApp();
        e.target.reset();
      }
    }

    function deleteJoueur(id) {
      if (confirm("Êtes-vous sûr de vouloir supprimer ce joueur ?")) {
        joueurs = joueurs.filter(j => j.id !== id);
        joueursPresents = joueursPresents.filter(j => j.id !== id);
        saveData();
        renderApp();
      }
    }

    function togglePresence(id) {
      const joueur = joueurs.find(j => j.id === id);
      if (!joueur) return;

      const index = joueursPresents.findIndex(j => j.id === id);
      if (index >= 0) {
        joueursPresents.splice(index, 1);
      } else {
        joueursPresents.push({ ...joueur });
      }
      saveData();
      renderApp();
    }

    function removePresent(id) {
      joueursPresents = joueursPresents.filter(j => j.id !== id);
      saveData();
      renderApp();
    }

    function showCreateTableModal() {
      if (joueursPresents.length < 4) {
        alert("Veuillez sélectionner au moins 4 joueurs présents pour créer une table.");
        return;
      }

      const modal = document.getElementById("create-table-modal");
      const select = document.getElementById("new-table-nb-joueurs");
      const checkboxGroup = document.getElementById("new-table-joueurs-select");

      // Remplir les checkboxes avec les joueurs présents
      checkboxGroup.innerHTML = joueursPresents.map(j => `
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" value="${j.id}" checked />
          <span>${j.nom}</span>
        </label>
      `).join('');

      modal.style.display = "flex";
    }

    function hideCreateTableModal() {
      document.getElementById("create-table-modal").style.display = "none";
    }

    function createTable() {
      const nbJoueurs = parseInt(document.getElementById("new-table-nb-joueurs").value);
      const selectedJoueurs = [];
      document.querySelectorAll("#new-table-joueurs-select input[type='checkbox']:checked").forEach(cb => {
        selectedJoueurs.push(cb.value);
      });

      if (selectedJoueurs.length !== nbJoueurs) {
        alert(`Veuillez sélectionner exactement ${nbJoueurs} joueurs.`);
        return;
      }

      tables.push({
        id: Date.now().toString(),
        date: new Date().toISOString().split('T')[0],
        nbJoueurs,
        menes: [],
        joueurs: selectedJoueurs
      });

      saveData();
      hideCreateTableModal();
      renderApp();
    }

    function viewTable(tableId) {
      const table = tables.find(t => t.id === tableId);
      if (!table) return;

      const menes = resultats.filter(r => r.tableId === tableId);
      const tableJoueurs = joueurs.filter(j => table.joueurs.includes(j.id));

      let content = `
        <div class="card" style="text-align: left;">
          <h2>Mènes pour la table du ${formatDateFR(table.date)}</h2>
          <p>Joueurs: ${tableJoueurs.map(j => j.nom).join(", ")}</p>
          <p>Nombre de ménes: ${menes.length}</p>
          ${menes.length > 0 ? `
            <div class="table-container" style="margin-top: 16px;">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Preneur</th>
                    <th>Contrat</th>
                    <th>Points</th>
                    <th>Résultat</th>
                    <th>Score</th>
                  </tr>
                </thead>
                <tbody>
                  ${menes.map(m => {
                    const preneur = joueurs.find(j => j.id === m.preneur);
                    const score = calculerScore(m, table.nbJoueurs);
                    return `
                      <tr>
                        <td>${formatDateFR(m.date)}</td>
                        <td>${preneur ? preneur.nom : "Inconnu"}</td>
                        <td>${m.contrat}</td>
                        <td>${m.points}</td>
                        <td>${score.gagne ? "✅ Gagné" : "❌ Perdu"}</td>
                        <td>${score.preneur >= 0 ? "+" : ""}${score.preneur}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : '<p style="color: var(--text-muted);">Aucune mène enregistrée pour cette table.</p>'}
          <button class="btn-ghost" onclick="renderApp()" style="margin-top: 16px;">Retour</button>
        </div>
      `;

      document.getElementById("main-content").innerHTML = content;
    }

    function deleteTable(tableId) {
      if (confirm("Êtes-vous sûr de vouloir supprimer cette table ?")) {
        tables = tables.filter(t => t.id !== tableId);
        resultats = resultats.filter(r => r.tableId !== tableId);
        saveData();
        renderApp();
      }
    }

    function loadTableMenes(tableId) {
      const form = document.getElementById("saisie-mene-form");
      if (tableId) {
        form.style.display = "block";
        // Réinitialiser les champs
        document.getElementById("saisie-preneur").value = "";
        document.getElementById("saisie-contrat").value = "Petite";
        document.getElementById("saisie-points").value = "";
        document.getElementById("saisie-petit").value = "aucun";
        document.getElementById("saisie-poignee").value = "Aucune";
        document.getElementById("saisie-poignee-side").value = "preneur";
        document.getElementById("saisie-chelem").value = "Aucun";
        document.getElementById("saisie-nb-bouts").value = "0";
        if (joueursPresents.length >= 5) {
          document.getElementById("saisie-appele").value = "";
        }
        if (joueursPresents.length >= 7) {
          document.getElementById("saisie-appele2").value = "";
        }
        document.getElementById("mene-result").style.display = "none";
      } else {
        form.style.display = "none";
      }
    }

    function saveMene() {
      const tableId = document.getElementById("saisie-table-select").value;
      const preneur = document.getElementById("saisie-preneur").value;
      const contrat = document.getElementById("saisie-contrat").value;
      const points = parseInt(document.getElementById("saisie-points").value);
      const petit = document.getElementById("saisie-petit").value;
      const poignee = document.getElementById("saisie-poignee").value;
      const poigneeSide = document.getElementById("saisie-poignee-side").value;
      const chelem = document.getElementById("saisie-chelem").value;
      const nbBouts = parseInt(document.getElementById("saisie-nb-bouts").value);
      const appele = document.getElementById("saisie-appele")?.value || null;
      const appele2 = document.getElementById("saisie-appele2")?.value || null;

      if (!tableId || !preneur || !contrat || isNaN(points)) {
        alert("Veuillez remplir tous les champs obligatoires.");
        return;
      }

      const table = tables.find(t => t.id === tableId);
      if (!table) {
        alert("Table introuvable.");
        return;
      }

      const meneData = {
        id: Date.now().toString(),
        tableId,
        preneur,
        contrat,
        points,
        petitAuBout: petit,
        poignee,
        poigneeSide,
        chelem,
        nbBouts,
        appele,
        appele2,
        date: new Date().toISOString().split('T')[0]
      };

      const score = calculerScore(meneData, table.nbJoueurs);

      resultats.push({
        ...meneData,
        ...score
      });

      // Mettre à jour les scores UNIQUEMENT pour les joueurs de la table
      const tableJoueursIds = table.joueurs;
      Object.keys(score.scoresParJoueur).forEach(joueurId => {
        if (tableJoueursIds.includes(joueurId)) {
          const joueurIndex = joueurs.findIndex(j => j.id === joueurId);
          if (joueurIndex >= 0) {
            joueurs[joueurIndex].scoreTotal += score.scoresParJoueur[joueurId];
          }
        }
      });

      saveData();

      // Afficher le résultat du calcul
      const resultDiv = document.getElementById("mene-result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `
        <p><strong>Résultat:</strong> ${score.gagne ? "✅ Gagné" : "❌ Perdu"}</p>
        <p><strong>Score preneur:</strong> ${score.preneur >= 0 ? "+" : ""}${score.preneur}</p>
        <p><strong>Détails:</strong> ${score.details}</p>
        <p><strong>Scores par joueur:</strong></p>
        <div style="margin-top: 8px; padding: 8px; background: var(--bg); border-radius: 8px;">
          ${Object.entries(score.scoresParJoueur).map(([joueurId, scoreJoueur]) => {
            const joueur = joueurs.find(j => j.id === joueurId);
            return `<p style="margin: 4px 0;">${joueur ? joueur.nom : "Inconnu"}: ${scoreJoueur >= 0 ? "+" : ""}${scoreJoueur}</p>`;
          }).join('')}
        </div>
      `;

      alert("Mène enregistrée avec succès ! Les scores des joueurs de la table ont été mis à jour.");
    }

    function showCreateSaisonModal() {
      document.getElementById("create-saison-modal").style.display = "flex";
      document.getElementById("new-saison-date").value = new Date().toISOString().split('T')[0];
    }

    function hideCreateSaisonModal() {
      document.getElementById("create-saison-modal").style.display = "none";
    }

    function createSaison() {
      const nom = document.getElementById("new-saison-nom").value.trim();
      const dateDebut = document.getElementById("new-saison-date").value;

      if (!nom || !dateDebut) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      saisons.push({
        id: Date.now().toString(),
        nom,
        dateDebut,
        tables: []
      });

      saveData();
      hideCreateSaisonModal();
      renderApp();
    }

    function viewSaison(saisonId) {
      const saison = saisons.find(s => s.id === saisonId);
      if (!saison) return;

      const saisonTables = tables.filter(t => saison.tables?.includes(t.id) || false);
      const saisonResultats = resultats.filter(r => saisonTables.some(t => t.id === r.tableId));

      let content = `
        <div class="card" style="text-align: left;">
          <h2>${saison.nom}</h2>
          <p><strong>Date de début:</strong> ${formatDateFR(saison.dateDebut)}</p>
          <p><strong>Nombre de tables:</strong> ${saisonTables.length}</p>
          <p><strong>Nombre de résultats:</strong> ${saisonResultats.length}</p>

          <h3 style="margin-top: 20px;">Tables de la saison</h3>
          ${saisonTables.length > 0 ? `
            <div style="margin-top: 12px;">
              ${saisonTables.map(t => `
                <div style="margin-top: 10px; padding: 12px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border);">
                  <p style="margin: 0; font-weight: 600;">Table du ${formatDateFR(t.date)} (${t.nbJoueurs} joueurs)</p>
                  <p style="margin: 5px 0 0 0; font-size: 14px; color: var(--text-muted);">
                    ${t.joueurs?.map(jId => {
                      const j = joueurs.find(j => j.id === jId);
                      return j ? getInitials(j.nom) : '';
                    }).join(" ")} -
                    ${t.menes?.length || 0} ménes
                  </p>
                </div>
              `).join('')}
            </div>
          ` : '<p style="color: var(--text-muted);">Aucune table dans cette saison.</p>'}

          <button class="btn-ghost" onclick="renderApp()" style="margin-top: 16px;">Retour</button>
        </div>
      `;

      document.getElementById("main-content").innerHTML = content;
    }

    function deleteSaison(saisonId) {
      if (confirm("Êtes-vous sûr de vouloir supprimer cette saison ?")) {
        saisons = saisons.filter(s => s.id !== saisonId);
        saveData();
        renderApp();
      }
    }

    function setActiveTab(tab) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      renderContent(tab);
    }

    function renderContent(tab) {
      const contentMap = {
        accueil: renderAccueil(),
        joueurs: renderJoueurs(),
        tables: renderTables(),
        saisie: renderSaisie(),
        resultats: renderResultats(),
        saisons: renderSaisons()
      };
      document.getElementById("main-content").innerHTML = contentMap[tab] || renderAccueil();
    }

    function renderUserSection() {
      const userSection = document.getElementById("user-section");
      if (user) {
        userSection.innerHTML = `
          <span class="user-badge">${user.role.toUpperCase()}</span>
          <button class="btn-ghost" onclick="logout()">Déconnexion</button>
        `;
      } else {
        userSection.innerHTML = '';
      }
    }

    function renderApp() {
      // Masquer les onglets selon le rôle
      document.getElementById("saisons-tab").style.display = user?.role === "admin" ? "flex" : "none";

      if (!user) {
        document.getElementById("main-content").innerHTML = renderLoginScreen();
        document.getElementById("user-section").innerHTML = '';
        document.getElementById("nav-tabs").style.display = "none";
      } else {
        document.getElementById("nav-tabs").style.display = "flex";
        renderUserSection();
        renderContent("accueil");
      }

      // Réattacher les écouteurs d'événements
      document.getElementById("login-form")?.addEventListener("submit", login);
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.onclick = () => setActiveTab(tab.dataset.tab);
      });
    }

    // ========== INITIALISATION ==========
    renderApp();
  </script>
</body>
</html>
