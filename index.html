<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent3: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem; background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      width: 2.5rem; height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem; display: flex; align-items: center;
      justify-content: center; color: white; font-weight: bold;
    }
    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 1rem; }
    .login-container {
      max-width: 500px; margin: 2rem auto; text-align: center;
      padding: 2rem; background: var(--card-bg); border-radius: 1rem;
      border: 1px solid var(--border);
    }
    .login-icon { font-size: 5rem; margin-bottom: 1rem; }
    .qr-section {
      margin: 1.5rem auto; padding: 1rem; background: var(--bg);
      border-radius: 0.75rem; border: 1px solid var(--border); max-width: 300px;
    }
    .btn {
      padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem;
      font-weight: 600; cursor: pointer; font-size: 0.95rem; width: 100%;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white; margin-top: 1rem;
    }
    .btn-success { background: var(--success); color: white; margin-top: 1rem; }
    .btn-secondary {
      background: var(--border); color: var(--text); margin-top: 1rem;
    }
    .btn-danger { background: var(--accent2); color: white; margin-top: 1rem; }
    .btn-small {
      padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; margin: 0;
    }
    #nav-tabs {
      display: flex; justify-content: center; background: var(--card-bg);
      border-bottom: 1px solid var(--border); padding: 0.5rem 0;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .nav-tab {
      padding: 0.75rem 1.5rem; background: transparent; color: var(--text);
      border: none; border-radius: 0.5rem 0.5rem 0 0; cursor: pointer;
      margin: 0 0.25rem; font-size: 0.9rem;
    }
    .nav-tab.active {
      background: var(--bg); color: var(--accent1);
      border-bottom: 2px solid var(--accent1);
    }
    .nav-tab:hover { background: rgba(255, 255, 255, 0.05); }
    #logout-btn { background: var(--accent2) !important; color: white !important; }
    input, select {
      width: 100%; padding: 0.75rem; border-radius: 0.5rem;
      border: 1px solid var(--border); background: #0f172a;
      color: var(--text); font-size: 0.95rem; margin: 0.5rem 0;
    }
    label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.25rem; display: block; }
    .error { color: var(--accent2); font-size: 0.85rem; margin: 0.5rem 0; }
    .card {
      background: var(--card-bg); border-radius: 0.75rem; padding: 1rem;
      margin-bottom: 1rem; border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border: 1px solid var(--border); text-align: left; }
    th { background: var(--card-bg); }
    tr:nth-child(even) { background: var(--bg); }
    .score-positif { color: var(--success); font-weight: bold; }
    .score-negatif { color: var(--accent2); font-weight: bold; }
    .score-zero { color: var(--text-muted); }

    /* Modale plein écran */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 100;
      display: none;
    }
    .modal-overlay.active { display: flex; flex-direction: column; }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem; background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-content {
      max-width: 800px; margin: 0 auto; padding: 1rem;
      flex: 1; overflow-y: auto; width: 100%;
    }
    .cumul-banner {
      background: var(--card-bg); border-radius: 0.75rem; padding: 1rem;
      margin-bottom: 1rem; border: 1px solid var(--accent1);
    }
    .cumul-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.5rem; margin-top: 0.5rem;
    }
    .cumul-item {
      text-align: center; padding: 0.5rem; background: var(--bg);
      border-radius: 0.5rem;
    }
    .cumul-item .nom { font-size: 0.8rem; color: var(--text-muted); }
    .cumul-item .score { font-size: 1.1rem; font-weight: bold; }
    .mene-form {
      background: var(--card-bg); border-radius: 0.75rem; padding: 1.5rem;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;
    }
    .form-group { margin-bottom: 1rem; }
    .radio-group {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;
    }
    .radio-btn {
      padding: 0.5rem 1rem; background: var(--bg); border: 1px solid var(--border);
      border-radius: 0.5rem; cursor: pointer; font-size: 0.9rem; color: var(--text);
    }
    .radio-btn.active {
      background: var(--accent1); color: var(--bg); border-color: var(--accent1);
      font-weight: bold;
    }
    .mene-list-item {
      background: var(--card-bg); border-radius: 0.5rem; padding: 1rem;
      margin-bottom: 0.5rem; border: 1px solid var(--border);
    }
    .mene-list-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.5rem;
    }
    .mene-scores {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.5rem;
    }
    .mene-score-item {
      text-align: center; padding: 0.5rem; background: var(--bg);
      border-radius: 0.5rem; font-size: 0.85rem;
    }
    .info-text { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem; }

    /* Liste des présents (scrollable) */
    .presents-container {
      max-height: 65vh; overflow-y: auto; margin-top: 1rem;
      border-radius: 0.75rem; border: 1px solid var(--border);
      background: var(--card-bg);
    }
    .presents-container::-webkit-scrollbar { width: 8px; }
    .presents-container::-webkit-scrollbar-track {
      background: var(--bg); border-radius: 0.5rem;
    }
    .presents-container::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 0.5rem;
    }
    .presents-container::-webkit-scrollbar-thumb:hover {
      background: var(--accent1);
    }
    .present-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.15s;
    }
    .present-row:last-child { border-bottom: none; }
    .present-row:hover { background: rgba(255, 255, 255, 0.04); }
    .present-row.present { background: rgba(16, 185, 129, 0.08); }
    .present-checkbox {
      width: 1.75rem; height: 1.75rem; flex-shrink: 0;
      border: 2px solid var(--border); border-radius: 0.4rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: all 0.15s;
    }
    .present-row.present .present-checkbox {
      background: var(--success); border-color: var(--success);
      color: white;
    }
    .present-nom { flex: 1; font-size: 1rem; }
    .present-row:not(.present) .present-nom {
      color: var(--text-muted);
    }
    .present-badge {
      font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 0.3rem;
    }
    .present-badge.on { background: var(--success); color: white; }
    .present-badge.off { background: var(--border); color: var(--text-muted); }

    /* Badge date du jour */
    .date-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--bg); border: 1px solid var(--accent1);
      border-radius: 0.5rem; padding: 0.4rem 0.8rem;
      font-size: 0.85rem; color: var(--accent1);
    }

    /* Ligne joueur cochable (popup affectation) */
    .affect-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.15s; border-radius: 0.4rem;
    }
    .affect-row:hover { background: rgba(255, 255, 255, 0.04); }
    .affect-row.checked { background: rgba(245, 158, 11, 0.10); }
    .affect-row.checked:hover { background: rgba(245, 158, 11, 0.15); }
    .affect-checkbox {
      width: 1.5rem; height: 1.5rem; flex-shrink: 0;
      border: 2px solid var(--border); border-radius: 0.35rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; transition: all 0.15s;
    }
    .affect-row.checked .affect-checkbox {
      background: var(--accent1); border-color: var(--accent1);
      color: var(--bg); font-weight: bold;
    }
    .affect-nom { flex: 1; font-size: 0.95rem; }
    .affect-row:not(.checked) .affect-nom { color: var(--text-muted); }

    /* Onglets période (Résultats) */
    .periode-tabs {
      display: flex; gap: 0.5rem; margin-bottom: 1rem;
    }
    .periode-tab {
      padding: 0.5rem 1.25rem; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 0.5rem;
      cursor: pointer; font-size: 0.9rem; color: var(--text-muted);
      transition: all 0.15s;
    }
    .periode-tab.active {
      background: var(--accent1); color: var(--bg);
      border-color: var(--accent1); font-weight: bold;
    }
    .periode-tab:hover:not(.active) {
      border-color: var(--accent1); color: var(--accent1);
    }

    /* Podium */
    .podium {
      display: flex; justify-content: center; align-items: flex-end;
      gap: 0.75rem; margin: 1.5rem 0;
    }
    .podium-item {
      text-align: center; padding: 1rem 0.75rem; border-radius: 0.75rem;
      background: var(--card-bg); border: 1px solid var(--border);
      min-width: 100px;
    }
    .podium-item .medaille { font-size: 2.5rem; }
    .podium-item .nom { font-size: 1rem; font-weight: bold; margin-top: 0.5rem; }
    .podium-item .score { font-size: 1.25rem; margin-top: 0.25rem; }
    .podium-item.p1 { border-color: #fbbf24; order: 2; padding-top: 1.5rem; }
    .podium-item.p2 { border-color: #94a3b8; order: 1; }
    .podium-item.p3 { border-color: #b45309; order: 3; }

    /* Saison card */
    .saison-card {
      background: var(--card-bg); border-radius: 0.75rem; padding: 1rem;
      margin-bottom: 1rem; border: 1px solid var(--accent1);
    }
    .saison-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--bg); border: 1px solid var(--accent1);
      border-radius: 0.4rem; padding: 0.3rem 0.6rem;
      font-size: 0.8rem; color: var(--accent1);
    }

    /* Badge historique */
    .hist-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent3);
      border-radius: 0.4rem; padding: 0.2rem 0.5rem;
      font-size: 0.75rem; color: var(--accent3);
    }

    /* Boutons toolbar admin */
    .toolbar-admin {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      max-width: 600px; margin: 0 auto;
    }
    .toolbar-admin .btn { margin-top: 0; font-size: 0.85rem; padding: 0.6rem 1rem; flex: 1; min-width: 130px; }
    .btn-export { background: var(--accent3); color: white; }
    .btn-save { background: var(--success); color: white; }
    .btn-restore { background: var(--accent1); color: var(--bg); }

    /* Styles impression PDF */
    @media print {
      body * { visibility: hidden; }
      #pdf-print-area, #pdf-print-area * { visibility: visible; }
      #pdf-print-area {
        position: absolute; left: 0; top: 0; width: 100%;
        background: white; color: black; padding: 20px;
      }
      #pdf-print-area table { width: 100%; border-collapse: collapse; }
      #pdf-print-area th, #pdf-print-area td {
        border: 1px solid #333; padding: 6px; text-align: left; color: black;
      }
      #pdf-print-area th { background: #e2e8f0; }
      #pdf-print-area h2, #pdf-print-area h3 { color: black; }
      #pdf-print-area .pdf-podium {
        display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap;
      }
      #pdf-print-area .pdf-podium-item {
        border: 1px solid #333; padding: 0.75rem; border-radius: 0.5rem; text-align: center; min-width: 120px;
      }
      #pdf-print-area .pdf-section { margin-bottom: 1.5rem; page-break-inside: avoid; }
      @page { margin: 1.5cm; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <span>ABJE Tarot</span>
    </div>
    <button id="logout-btn" class="btn btn-danger" style="display: none; width: auto;">
      Déconnexion
    </button>
  </header>

  <nav id="nav-tabs" style="display: none;">
    <button class="nav-tab active" onclick="showTab('accueil')">🏠 Accueil</button>
    <button class="nav-tab" onclick="showTab('membres')">👥 Membres</button>
    <button class="nav-tab" onclick="showTab('presents')">✅ Présents</button>
    <button class="nav-tab" onclick="showTab('tables')">🎲 Tables</button>
    <button class="nav-tab" onclick="showTab('saisie')">✏️ Saisie</button>
    <button class="nav-tab" onclick="showTab('resultats')">🏆 Résultats</button>
  </nav>

  <main id="app"></main>

  <!-- Zone d'impression PDF (cachée à l'écran) -->
  <div id="pdf-print-area" style="display: none;"></div>

  <!-- Modale plein écran pour la saisie -->
  <div id="saisie-modal" class="modal-overlay">
    <div class="modal-header">
      <h2 id="modal-title">Saisie des scores</h2>
      <button onclick="fermerSaisie()" class="btn btn-danger btn-small">
        Fermer
      </button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    // ========== CONSTANTES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    // Règles FFTarot : points à faire selon le nombre de bouts
    const BOUTS_REQUIS = {
      0: 56, 1: 51, 2: 41, 3: 36
    };
    // Contrats et leurs multiplicateurs
    const CONTRATS = {
      "petite": { mult: 1, label: "Petite", minJoueurs: 4 },
      "garde": { mult: 2, label: "Garde" },
      "garde_sans": { mult: 4, label: "Garde sans" },
      "garde_contre": { mult: 6, label: "Garde contre" }
    };

    // ========== UTILITAIRES DATE ==========
    function aujourdhui() {
      return new Date().toDateString();
    }
    function formatDateLong(date) {
      const jours = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
      const mois = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
      const d = new Date(date);
      return `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]} ${d.getFullYear()}`;
    }
    function formatDateCourte(date) {
      const d = new Date(date);
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }
    function toDateInput(date) {
      const d = new Date(date);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const j = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${j}`;
    }

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: 1, nom: "Joueur 1", disponible: false },
      { id: 2, nom: "Joueur 2", disponible: false },
      { id: 3, nom: "Joueur 3", disponible: false },
      { id: 4, nom: "Joueur 4", disponible: false },
      { id: 5, nom: "Joueur 5", disponible: false }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];
    let menes = JSON.parse(localStorage.getItem("abje_menes")) || [];
    let parties = JSON.parse(localStorage.getItem("abje_parties")) || [];
    let saisons = JSON.parse(localStorage.getItem("abje_saisons")) || [];

    // Migration anciennes tables sans date
    tables.forEach(t => {
      if (!t.date) t.date = aujourdhui();
      if (!t.joueursAffectes) t.joueursAffectes = [];
    });

    // État temporaire pour la saisie
    let saisieEnCours = null;

    // État popup affectation (pas de re-render complet)
    let popupAffectationOuvert = -1;
    let joueursSelectionnes = [];

    // État module résultats
    let resultatsPeriode = 'saison'; // 'jour', 'mois', 'saison'
    let resultatsSaisonId = null;    // ID de la saison sélectionnée

    // État saisie historique
    let histEnCours = null; // { date, lieu, nbJoueurs, joueursIds: [], menes: [], cumuls: {}, modeRapide: false, cumulsRapides: {} }

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables));
      localStorage.setItem("abje_menes", JSON.stringify(menes));
      localStorage.setItem("abje_parties", JSON.stringify(parties));
      localStorage.setItem("abje_saisons", JSON.stringify(saisons));
    }

    // ========== HELPERS SAISON ==========
    function getSaisonActuelle() {
      const now = new Date();
      return saisons.find(s => {
        const debut = new Date(s.dateDebut);
        const fin = new Date(s.dateFin);
        return now >= debut && now <= fin;
      });
    }

    function getSaisonById(id) {
      return saisons.find(s => s.id === id);
    }

    // ========== RENDU LOGIN ==========
    function renderLogin() {
      document.getElementById("nav-tabs").style.display = "none";
      document.getElementById("logout-btn").style.display = "none";
      document.getElementById("app").innerHTML = `
        <div class="login-container">
          <div class="login-icon">🃏</div>
          <h1>ABJE Tarot</h1>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
            Gestion de club de Tarot
          </p>
          <form id="loginForm">
            <input type="text" id="login" placeholder="Login (admin/abje)"
              required autocomplete="username">
            <input type="password" id="password" placeholder="Mot de passe"
              required autocomplete="current-password">
            <div id="loginError" class="error"></div>
            <button type="submit" class="btn btn-primary">Se connecter</button>
          </form>
          <div class="qr-section">
            <p style="margin-bottom: 0.75rem; color: var(--text-muted);">
              Accès mobile :
            </p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(APP_URL)}&bgcolor=1e293b&color=f8fafc"
              alt="QR Code" width="150"
              style="border-radius: 0.5rem; border: 2px solid var(--border); margin: 0 auto; display: block;">
          </div>
        </div>
      `;
      document.getElementById("loginForm").onsubmit = function(e) {
        e.preventDefault();
        const login = document.getElementById("login").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("loginError");
        if ((login === "admin" && password === ADMIN_PASSWORD) ||
            (login === "abje" && password === ABJE_PASSWORD)) {
          user = { role: login };
          errorEl.textContent = "";
          saveData();
          renderApp();
        } else {
          errorEl.textContent = "Login ou mot de passe incorrect";
        }
      };
    }

    // ========== GESTION DES ONGLETS ==========
    function showTab(tab) {
      if (!user) { renderLogin(); return; }
      popupAffectationOuvert = -1;
      joueursSelectionnes = [];
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeTab = Array.from(document.querySelectorAll('.nav-tab')).find(
        t => t.getAttribute('onclick').includes(tab)
      );
      if (activeTab) activeTab.classList.add('active');
      if (tab === 'accueil') renderAccueil();
      else if (tab === 'membres') renderMembres();
      else if (tab === 'presents') renderPresents();
      else if (tab === 'tables') renderTables();
      else if (tab === 'saisie') renderSaisie();
      else if (tab === 'resultats') renderResultats();
    }

    // ========== RENDU ACCUEIL ==========
    function renderAccueil() {
      const tablesDuJour = tables.filter(t => t.date === aujourdhui());
      const tablesCompletes = tablesDuJour.filter(t =>
        t.joueursAffectes && t.joueursAffectes.length === t.nbJoueurs
      ).length;
      const saison = getSaisonActuelle();

      document.getElementById("app").innerHTML = `
        <div style="text-align: center; padding: 2rem;">
          <h2>Bienvenue, ${user.role} !</h2>
          <p>Gestion complète de votre club de Tarot.</p>

          <!-- Saison -->
          <div class="saison-card" style="max-width: 600px; margin: 1.5rem auto;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="text-align: left;">

    // ========== GESTION DES SAISONS ==========

            <button onclick="showTab('accueil')" class="btn btn-secondary"

          </div>

            : saisons.map(s => {
              const isActuelle = getSaisonActuelle() && getSaisonActuelle().id === s.id;
              return `
                <div class="card" style="${isActuelle ? 'border-color: var(--accent1);' : ''}">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                      <strong>${s.nom}</strong>
                      ${isActuelle ? '<span class="saison-badge" style="margin-left: 0.5rem;">EN COURS</span>' : ''}
                      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">

                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                      <button onclick="supprimerSaison(${s.id})"

    function creerSaison() {
      const nom = document.getElementById("newSaisonNom").value.trim();
      const debut = document.getElementById("newSaisonDebut").value;
      const fin = document.getElementById("newSaisonFin").value;
      if (!nom || !debut || !fin) {
        alert("Veuillez remplir tous les champs.");
        return;
      }
      if (new Date(debut) >= new Date(fin)) {
        alert("La date de fin doit être après la date de début.");
        return;
      }
      saisons.push({
        id: Date.now(),
        nom: nom,
        dateDebut: debut,
        dateFin: fin
      });
      saisons.sort((a, b) => new Date(b.dateDebut) - new Date(a.dateDebut));
      saveData();
      renderGestionSaisons();
    }

    function supprimerSaison(id) {
      if (confirm("Supprimer cette saison ? Les mènes ne sont pas affectées.")) {
        saisons = saisons.filter(s => s.id !== id);
        saveData();
        renderGestionSaisons();
      }
    }

    function toggleAllPresents() {
      const tousPresents = joueurs.every(j => j.disponible);

      renderPresents();

    function addJoueur() {
      document.getElementById("add-joueur-form").style.display = "block";
      document.getElementById("newJoueurNom").focus();
    }

    function confirmAddJoueur() {
      const nom = document.getElementById("newJoueurNom").value;
      if (nom && nom.trim()) {
        joueurs.push({ id: Date.now(), nom: nom.trim(), disponible: false });
        saveData();
        renderMembres();
      }
    }

    function toggleDispo(index) {
      joueurs[index].disponible = !joueurs[index].disponible;
      saveData();
      renderPresents();
    }

    function deleteJoueur(index) {
      joueurs.splice(index, 1);
      saveData();
      renderMembres();
    }

    // ========== HELPERS TABLES ==========
    function getTablesDuJour() {
      return tables.filter(t => t.date === aujourdhui());
    }

    function estJoueurAffecteAilleurs(joueurId, tableIndexIgnore) {
      return getTablesDuJour().some((t, i) => {
        if (i === tableIndexIgnore) return false;
        return t.joueursAffectes && t.joueursAffectes.includes(joueurId);
      });
    }

    function getJoueursDisposPourTable(tableIndex) {
      const table = tables[tableIndex];
      const dejaAffectes = table.joueursAffectes || [];
      return joueurs.filter(j =>
        j.disponible &&
        !dejaAffectes.includes(j.id) &&
        !estJoueurAffecteAilleurs(j.id, tableIndex)
      );
    }

    // ========== RENDU TABLES ==========
    function renderTables() {
      const isAdmin = user.role === 'admin';
      const tablesDuJour = getTablesDuJour();
      popupAffectationOuvert = -1;
      joueursSelectionnes = [];

      document.getElementById("app").innerHTML = `
        <div style="padding: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <h2>🎲 Tables du jour</h2>
            ${isAdmin ? `<button onclick="createTable()" class="btn btn-primary" style="width: auto; margin: 0;">+ Nouvelle table</button>` : ''}
          </div>
          <div class="date-badge" style="margin-bottom: 1rem;">
            📅 ${formatDateLong(new Date())}
          </div>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
            Les tables ne sont ouvertes que pour aujourd'hui. Seuls les membres présents
            et non encore affectés à une autre table peuvent être sélectionnés.
          </p>
          ${isAdmin ? `<div id="create-table-form" class="card" style="display: none; margin-bottom: 1rem;">
            <h3 style="margin-bottom: 0.5rem;">Nouvelle table</h3>
            <input type="number" id="newTableNb" placeholder="Nombre de joueurs (4-7)" min="4" max="7" />
            <button onclick="confirmCreateTable()" class="btn btn-primary" style="margin-top: 0.5rem;">Créer</button>
          </div>` : ''}
          ${tablesDuJour.length === 0 ? `
            <div style="text-align: center; color: var(--text-muted); padding: 2rem;">
              <p>Aucune table ouverte pour aujourd'hui.</p>
            </div>
          ` : tablesDuJour.map((t) => {
            const index = tables.indexOf(t);
            return `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h3 style="margin: 0;">Table n°${t.numero} (${t.nbJoueurs} joueurs)</h3>
                ${isAdmin ? `<button onclick="deleteTable(${index})"
                  style="background: var(--accent2); color: white; border: none;
                  border-radius: 0.25rem; padding: 0.25rem 0.5rem; cursor: pointer;">×</button>` : ''}
              </div>
              <div id="table-info-${index}">
                ${renderTableInfo(index)}
              </div>
              <button id="btn-affect-${index}" onclick="toggleAffectation(${index})" class="btn btn-primary" style="margin-top: 0.75rem; width: 100%;">
                ${(t.joueursAffectes && t.joueursAffectes.length === t.nbJoueurs) ? '✅ Table complète' : '+ Affecter joueurs'}
              </button>
              <div id="affectation-form-${index}" style="display: none;"></div>
            </div>
          `;}).join('')}
        </div>
      `;
    }

    function renderTableInfo(index) {
      const t = tables[index];
      const placesRestantes = t.nbJoueurs - (t.joueursAffectes ? t.joueursAffectes.length : 0);
      let html = `<p style="margin: 0 0 0.5rem 0; color: var(--text-muted);">
        Joueurs affectés: ${t.joueursAffectes ? t.joueursAffectes.length : 0}/${t.nbJoueurs}
        ${placesRestantes > 0 ? '• ' + placesRestantes + ' place(s) restante(s)' : '• ✅ Complète'}
      </p>`;
      if (t.joueursAffectes && t.joueursAffectes.length > 0) {
        html += `<div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;">`;
        t.joueursAffectes.forEach((joueurId, jIndex) => {
          const joueur = joueurs.find(j => j.id === joueurId);
          if (joueur) {
            html += `
              <span style="background: var(--bg); padding: 0.25rem 0.5rem;
                border-radius: 0.5rem; font-size: 0.85rem; display: flex;
                align-items: center; gap: 0.25rem;">
                ${joueur.nom}
                <button onclick="retirerJoueurTable(${index}, ${jIndex})"
                  style="background: var(--accent2); color: white; border: none;
                  border-radius: 50%; width: 1.2rem; height: 1.2rem; padding: 0;
                  cursor: pointer; font-size: 0.7rem; display: flex;
                  align-items: center; justify-content: center;">×</button>
              </span>`;
          }
        });
        html += `</div>`;
      }
      return html;
    }

    function renderPopupAffectation(index) {
      const t = tables[index];
      if (!t.joueursAffectes) t.joueursAffectes = [];
      const placesRestantes = t.nbJoueurs - t.joueursAffectes.length;
      const dispos = getJoueursDisposPourTable(index);

      let html = `
        <div class="card" style="margin-top: 1rem; background: var(--bg); border: 1px solid var(--accent1);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <h4 style="margin: 0;">Affecter les joueurs</h4>
            <span style="font-size: 0.85rem; color: var(--text-muted);">
              ${placesRestantes > 0 ? placesRestantes + ' place(s) restante(s)' : 'Complète'}
            </span>
          </div>
      `;

      html += `
        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
          <input type="text" id="quick-add-${index}" placeholder="➕ Nouveau joueur à la volée"
            style="flex: 1; margin: 0;"
            onkeypress="if(event.key==='Enter'){event.preventDefault();quickAddJoueur(${index});}" />
          <button onclick="quickAddJoueur(${index})" class="btn btn-secondary"
            style="width: auto; margin: 0; padding: 0.5rem 0.8rem; font-size: 0.85rem;">
            Créer
          </button>
        </div>
      `;

      if (dispos.length === 0) {
        html += `<p style="color: var(--text-muted); font-size: 0.9rem; padding: 0.5rem 0;">
          Aucun joueur disponible. Cochez des présents dans l'onglet ✅ ou créez-en un à la volée.</p>`;
      } else {
        html += `<div id="players-list-${index}" style="max-height: 40vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.25rem;">`;
        dispos.forEach(j => {
          const isChecked = joueursSelectionnes.includes(j.id);
          html += `
            <div class="affect-row ${isChecked ? 'checked' : ''}"
              onclick="toggleSelectionJoueur(${j.id})">
              <div class="affect-checkbox">${isChecked ? '✓' : ''}</div>
              <span class="affect-nom">${j.nom}</span>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `
        <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap;">
          <button onclick="affecterSelectionnes(${index})" class="btn btn-success"
            style="width: auto; margin: 0; flex: 1; min-width: 140px;">
            ✅ Affecter (${joueursSelectionnes.length})
          </button>
          <button onclick="affecterAleatoire(${index})" class="btn btn-secondary"
            style="width: auto; margin: 0; min-width: 100px;">
            🎲 Aléatoire
          </button>
          <button onclick="toggleAffectation(${index})" class="btn btn-secondary"
            style="width: auto; margin: 0;">
            Fermer
          </button>
        </div>
      `;

      html += `</div>`;
      return html;
    }

    function refreshPopup(index) {
      const infoEl = document.getElementById(`table-info-${index}`);
      if (infoEl) infoEl.innerHTML = renderTableInfo(index);
      const t = tables[index];
      const btnEl = document.getElementById(`btn-affect-${index}`);
      if (btnEl) {
        btnEl.textContent = (t.joueursAffectes && t.joueursAffectes.length === t.nbJoueurs)
          ? '✅ Table complète' : '+ Affecter joueurs';
      }
      if (popupAffectationOuvert === index) {
        const popupEl = document.getElementById(`affectation-form-${index}`);
        if (popupEl) popupEl.innerHTML = renderPopupAffectation(index);
      }
    }

    function createTable() {
      document.getElementById("create-table-form").style.display = "block";
      document.getElementById("newTableNb").focus();
    }

    function confirmCreateTable() {
      const nb = parseInt(document.getElementById("newTableNb").value);
      if (nb && [4,5,6,7].includes(nb)) {
        tables.push({ id: Date.now(), numero: tables.length + 1, nbJoueurs: nb, joueursAffectes: [], date: aujourdhui() });
        saveData();
        renderTables();
      } else {
        alert("Veuillez entrer un nombre entre 4 et 7.");
      }
    }

    function deleteTable(index) {
      tables.splice(index, 1);
      saveData();
      renderTables();
    }

    function toggleAffectation(index) {
      const form = document.getElementById(`affectation-form-${index}`);
      if (popupAffectationOuvert === index) {
        form.style.display = "none";
        form.innerHTML = "";
        popupAffectationOuvert = -1;
        joueursSelectionnes = [];
      } else {
        if (popupAffectationOuvert !== -1) {
          const old = document.getElementById(`affectation-form-${popupAffectationOuvert}`);
          if (old) { old.style.display = "none"; old.innerHTML = ""; }
        }
        joueursSelectionnes = [];
        popupAffectationOuvert = index;
        form.innerHTML = renderPopupAffectation(index);
        form.style.display = "block";
      }
    }

    function toggleSelectionJoueur(joueurId) {
      const idx = joueursSelectionnes.indexOf(joueurId);
      if (idx === -1) {
        joueursSelectionnes.push(joueurId);
      } else {
        joueursSelectionnes.splice(idx, 1);
      }
      const popupEl = document.getElementById(`affectation-form-${popupAffectationOuvert}`);
      if (popupEl) popupEl.innerHTML = renderPopupAffectation(popupAffectationOuvert);
    }

    function affecterSelectionnes(tableIndex) {
      const table = tables[tableIndex];
      if (!table.joueursAffectes) table.joueursAffectes = [];
      let placesRestantes = table.nbJoueurs - table.joueursAffectes.length;
      if (placesRestantes <= 0) { alert("Table complète !"); return; }
      if (joueursSelectionnes.length === 0) { alert("Cochez au moins un joueur."); return; }
      const aAffecter = joueursSelectionnes.slice(0, placesRestantes);
      aAffecter.forEach(jid => {
        if (table.joueursAffectes.length < table.nbJoueurs) {
          table.joueursAffectes.push(jid);
        }
      });
      joueursSelectionnes = joueursSelectionnes.filter(jid => !aAffecter.includes(jid));
      saveData();
      refreshPopup(tableIndex);
    }

    function affecterAleatoire(tableIndex) {
      const table = tables[tableIndex];
      if (!table.joueursAffectes) table.joueursAffectes = [];
      let placesRestantes = table.nbJoueurs - table.joueursAffectes.length;
      if (placesRestantes <= 0) { alert("Table complète !"); return; }
      let dispos = getJoueursDisposPourTable(tableIndex);
      if (dispos.length === 0) {
        alert("Aucun joueur disponible pour l'affectation aléatoire.");
        return;
      }
      for (let i = dispos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dispos[i], dispos[j]] = [dispos[j], dispos[i]];
      }
      const nbAAffecter = Math.min(placesRestantes, dispos.length);
      for (let i = 0; i < nbAAffecter; i++) {
        table.joueursAffectes.push(dispos[i].id);
      }
      joueursSelectionnes = [];
      saveData();

      const input = document.getElementById(`quick-add-${tableIndex}`);
      const nom = input ? input.value.trim() : "";
      if (!nom) { alert("Saisissez un nom."); return; }
      const nouveauId = Date.now();
      joueurs.push({ id: nouveauId, nom: nom, disponible: true });
      const table = tables[tableIndex];
      if (table.joueursAffectes.length < table.nbJoueurs) {
        table.joueursAffectes.push(nouveauId);
      } else {
        alert("Table complète, joueur créé et marqué présent mais non affecté.");

      saveData();
      input.value = "";
      refreshPopup(tableIndex);

      tables[tableIndex].joueursAffectes.splice(joueurIndex, 1);

        refreshPopup(tableIndex);

    function ouvrirSaisie(tableId) {
      const table = tables.find(t => t.id === tableId);
      if (!table) return;
      saisieEnCours = { tableId: tableId, menes: [], cumuls: {} };
      table.joueursAffectes.forEach(jid => { saisieEnCours.cumuls[jid] = 0; });
      const aujourd = new Date().toDateString();
      menes.forEach(m => {
        if (m.tableId === tableId && new Date(m.date).toDateString() === aujourd) {
          saisieEnCours.menes.push(m);
          m.joueurs.forEach((jid, i) => {
            saisieEnCours.cumuls[jid] = (saisieEnCours.cumuls[jid] || 0) + m.scores[i];
          });
        }
      });
      document.getElementById("saisie-modal").classList.add("active");
      document.getElementById("modal-title").textContent = `Saisie - Table n°${table.numero}`;
      renderModalContent();
    }

    function selectContrat(key) {
      document.querySelectorAll('#contrat-group .radio-btn').forEach(btn => btn.classList.remove('active'));

    function arrondiDizaine(n) {
      return Math.round(n / 10) * 10;
    }

    function calculerScoreMene() {
      const table = tables.find(t => t.id === saisieEnCours.tableId);
      const nbJoueurs = table.nbJoueurs;
      const preneurId = parseInt(document.getElementById("preneur").value);
      const contrat = document.querySelector('#contrat-group .radio-btn.active')?.dataset.value;
      const bouts = parseInt(document.getElementById("bouts").value);
      const points = parseFloat(document.getElementById("points").value);
      const petitBout = document.getElementById("petitBout").value;
      const poignee = parseInt(document.getElementById("poignee").value);
      const chelem = parseInt(document.getElementById("chelem").value);
      const appeleId = nbJoueurs >= 5 ? parseInt(document.getElementById("appele").value) : 0;

      if (isNaN(points)) return null;

      const multContrat = CONTRATS[contrat].mult;
      const ptsRequis = BOUTS_REQUIS[bouts];
      let ecart = points - ptsRequis;
      let petitAuBoutPts = 0;
      if (petitBout === 'preneur') { ecart += 10; petitAuBoutPts = 10; }
      else if (petitBout === 'defense') { ecart -= 10; petitAuBoutPts = -10; }
      let base = arrondiDizaine(25 + Math.abs(ecart)) * multContrat;
      const partieGagnee = ecart >= 0;
      let poigneePts = poignee;
      let chelemPts = chelem;
      let scorePreneur, scoreAppele, scoreDefense;

      if (nbJoueurs === 4) {
        let total = base + poigneePts + chelemPts;
        if (partieGagnee) { scorePreneur = total; scoreDefense = -total; }
        else { scorePreneur = -total; scoreDefense = total; }
        scorePreneur = scorePreneur * 3;
      } else if (nbJoueurs === 5) {
        let total = base + poigneePts + chelemPts;
        if (partieGagnee) { scorePreneur = total; scoreAppele = total; scoreDefense = -total; }
        else { scorePreneur = -total; scoreAppele = -total; scoreDefense = total; }
        scorePreneur = scorePreneur * 2;
      } else {
        let total = base + poigneePts + chelemPts;
        if (partieGagnee) { scorePreneur = total; scoreAppele = total; scoreDefense = -total; }
        else { scorePreneur = -total; scoreAppele = -total; scoreDefense = total; }
        scorePreneur = scorePreneur * 2;
      }

      return { preneurId, appeleId, contrat, bouts, points, petitBout, poignee, chelem,
        base, poigneePts, chelemPts, petitAuBoutPts, scorePreneur, scoreAppele, scoreDefense, partieGagnee };
    }

    function previsualiserScore() {
      const res = calculerScoreMene();
      const preview = document.getElementById("score-preview");
      const resultat = document.getElementById("score-resultat");
      if (!res) {
        preview.style.display = "block";
        resultat.innerHTML = '<span style="color: var(--accent2);">Veuillez saisir les points.</span>';
        return;
      }
      const preneur = joueurs.find(j => j.id === res.preneurId);
      const appele = res.appeleId ? joueurs.find(j => j.id === res.appeleId) : null;
      preview.style.display = "block";
      const statut = res.partieGagnee ? '✅ Gagnée' : '❌ Perdue';
      const couleur = res.partieGagnee ? 'var(--success)' : 'var(--accent2)';
      let html = `<strong style="color: ${couleur};">${statut}</strong><br>`;
      html += `${preneur ? preneur.nom : '?'} : <span class="${res.scorePreneur >= 0 ? 'score-positif' : 'score-negatif'}">${res.scorePreneur > 0 ? '+' : ''}${res.scorePreneur}</span><br>`;
      if (appele) {
        html += `${appele.nom} (appelé) : <span class="${res.scoreAppele >= 0 ? 'score-positif' : 'score-negatif'}">${res.scoreAppele > 0 ? '+' : ''}${res.scoreAppele}</span><br>`;
      }
      html += `Défense : <span class="${res.scoreDefense >= 0 ? 'score-positif' : 'score-negatif'}">${res.scoreDefense > 0 ? '+' : ''}${res.scoreDefense}</span>`;
      resultat.innerHTML = html;
    }

    function validerMene() {
      const res = calculerScoreMene();
      if (!res) { alert("Veuillez saisir les points réalisés."); return; }
      const table = tables.find(t => t.id === saisieEnCours.tableId);
      const nonJoueur1 = document.getElementById("nonJoueur1")?.value ? parseInt(document.getElementById("nonJoueur1").value) : 0;
      const nonJoueur2 = document.getElementById("nonJoueur2")?.value ? parseInt(document.getElementById("nonJoueur2").value) : 0;

      const scores = [];
      table.joueursAffectes.forEach(jid => {
        if (jid === nonJoueur1 || jid === nonJoueur2) { scores.push(0); }
        else if (jid === res.preneurId) { scores.push(res.scorePreneur); }
        else if (jid === res.appeleId) { scores.push(res.scoreAppele); }
        else { scores.push(res.scoreDefense); }
      });

      const somme = scores.reduce((a, b) => a + b, 0);
      if (somme !== 0) console.warn("Somme scores != 0:", somme);

      const mene = {
        id: Date.now(),
        tableId: table.id,
        joueurs: [...table.joueursAffectes],
        scores: scores,
        date: new Date().toISOString(),
        contrat: res.contrat,
        bouts: res.bouts,
        points: res.points,
        petitBout: res.petitBout,
        poignee: res.poignee,
        chelem: res.chelem,
        appele: res.appeleId,
        nonJoueur1: nonJoueur1,
        nonJoueur2: nonJoueur2,
        preneur: res.preneurId,
        gagnee: res.partieGagnee
      };
      saisieEnCours.menes.push(mene);
      table.joueursAffectes.forEach((jid, i) => {
        saisieEnCours.cumuls[jid] = (saisieEnCours.cumuls[jid] || 0) + scores[i];
      });
      renderModalContent();
    }

    function validerPartie() {
      if (saisieEnCours.menes.length === 0) { alert("Aucune mène à valider."); return; }
      const aujourd = new Date().toDateString();
      const tableId = saisieEnCours.tableId;
      menes = menes.filter(m => !(m.tableId === tableId && new Date(m.date).toDateString() === aujourd));
      menes.push(...saisieEnCours.menes);
      saveData();
      fermerSaisie();
      alert("✅ Partie validée !");
    }

    function histSwitchMode(rapide) {
      histEnCours.modeRapide = rapide;
      renderSaisieHistorique();
    }

    function histMajApercuRapide() {
      let somme = 0;
      let tousRemp = true;
      histEnCours.joueursIds.forEach(jid => {
        const val = histEnCours.cumulsRapides[jid];
        if (val === '' || val === undefined || isNaN(val)) {
          tousRemp = false;
        } else {
          somme += parseInt(val);
        }
      });
      const sommeEl = document.getElementById('hist-rapide-somme');
      const statutEl = document.getElementById('hist-rapide-statut');
      if (sommeEl) sommeEl.textContent = somme;
      if (statutEl) {
        if (!tousRemp) {
          statutEl.innerHTML = '<span style="color: var(--text-muted);">⏳ Saisie en cours</span>';
        } else if (somme === 0) {
          statutEl.innerHTML = '<span style="color: var(--success);">✅ Équilibré</span>';
        } else {
          statutEl.innerHTML = `<span style="color: var(--accent2);">⚠️ Somme ≠ 0 (${somme > 0 ? '+' : ''}${somme})</span>`;
        }
      }
    }

    function histValiderRapide() {
      // Vérifier que tous les scores sont saisis
      let somme = 0;
      let tousRemp = true;
      histEnCours.joueursIds.forEach(jid => {
        const val = histEnCours.cumulsRapides[jid];
        if (val === '' || val === undefined || isNaN(val)) {
          tousRemp = false;
        } else {
          somme += parseInt(val);
        }
      });
      if (!tousRemp) { alert("Veuillez saisir un score pour chaque joueur."); return; }
      if (somme !== 0) {
        if (!confirm(`La somme des scores est ${somme > 0 ? '+' : ''}${somme} (différente de 0). Valider quand même ?`)) return;
      }

      // Créer une seule "mène" synthétique avec les cumuls directs
      const dateObj = new Date(histEnCours.date + 'T12:00:00');
      const scores = histEnCours.joueursIds.map(jid => parseInt(histEnCours.cumulsRapides[jid]));

      const mene = {
        id: Date.now(),
        tableId: -1,
        joueurs: [...histEnCours.joueursIds],
        scores: scores,
        date: dateObj.toISOString(),
        contrat: 'cumul',
        bouts: 0,
        points: 0,
        petitBout: '0',
        poignee: 0,
        chelem: 0,
        appele: 0,
        nonJoueur1: 0,
        nonJoueur2: 0,
        preneur: 0,
        gagnee: false,
        historique: true,
        cumulDirect: true,
        lieu: histEnCours.lieu || ''
      };
      menes.push(mene);
      saveData();
      fermerSaisie();
      alert("✅ Cumuls validés ! Les scores apparaîtront dans les filtres Jour/Mois/Saison.");
    }

    function histUpdateDate(val) {
      histEnCours.date = val;
    }

    function histUpdateNb(val) {
      const nb = parseInt(val);
      histEnCours.nbJoueurs = nb;
      // Tronquer la liste si trop de joueurs
      if (histEnCours.joueursIds.length > nb) {
        histEnCours.joueursIds = histEnCours.joueursIds.slice(0, nb);
      }
      // Réinitialiser les cumuls
      histEnCours.cumuls = {};
      histEnCours.joueursIds.forEach(jid => { histEnCours.cumuls[jid] = 0; });
      histEnCours.menes.forEach(m => {
        m.joueurs.forEach((jid, i) => {
          histEnCours.cumuls[jid] = (histEnCours.cumuls[jid] || 0) + m.scores[i];
        });
      });
      renderSaisieHistorique();
    }

    function histToggleJoueur(jid) {
      const idx = histEnCours.joueursIds.indexOf(jid);
      if (idx === -1) {
        if (histEnCours.joueursIds.length < histEnCours.nbJoueurs) {
          histEnCours.joueursIds.push(jid);
          histEnCours.cumuls[jid] = 0;
        }
      } else {
        histEnCours.joueursIds.splice(idx, 1);
        delete histEnCours.cumuls[jid];
      }
      renderSaisieHistorique();
    }

    function histQuickAdd() {
      const input = document.getElementById("hist-quick-add");
      const nom = input ? input.value.trim() : "";
      if (!nom) { alert("Saisissez un nom."); return; }
      const nouveauId = Date.now();
      joueurs.push({ id: nouveauId, nom: nom, disponible: false });
      saveData();
      if (histEnCours.joueursIds.length < histEnCours.nbJoueurs) {
        histEnCours.joueursIds.push(nouveauId);
        histEnCours.cumuls[nouveauId] = 0;
      }
      renderSaisieHistorique();
    }

    function histCalculerScore() {
      const nbJoueurs = histEnCours.nbJoueurs;
      const joueursList = histEnCours.joueursIds;
      const preneurId = parseInt(document.getElementById("preneur").value);
      const contrat = document.querySelector('#contrat-group .radio-btn.active')?.dataset.value;
      const bouts = parseInt(document.getElementById("bouts").value);
      const points = parseFloat(document.getElementById("points").value);
      const petitBout = document.getElementById("petitBout").value;
      const poignee = parseInt(document.getElementById("poignee").value);
      const chelem = parseInt(document.getElementById("chelem").value);
      const appeleId = nbJoueurs >= 5 ? parseInt(document.getElementById("appele").value) : 0;

      if (isNaN(points)) return null;

      const multContrat = CONTRATS[contrat].mult;
      const ptsRequis = BOUTS_REQUIS[bouts];
      let ecart = points - ptsRequis;
      let petitAuBoutPts = 0;
      if (petitBout === 'preneur') { ecart += 10; petitAuBoutPts = 10; }
      else if (petitBout === 'defense') { ecart -= 10; petitAuBoutPts = -10; }
      let base = arrondiDizaine(25 + Math.abs(ecart)) * multContrat;
      const partieGagnee = ecart >= 0;
      let poigneePts = poignee;
      let chelemPts = chelem;
      let scorePreneur, scoreAppele, scoreDefense;

      if (nbJoueurs === 4) {
        let total = base + poigneePts + chelemPts;
        if (partieGagnee) { scorePreneur = total; scoreDefense = -total; }
        else { scorePreneur = -total; scoreDefense = total; }
        scorePreneur = scorePreneur * 3;
      } else if (nbJoueurs === 5) {
        let total = base + poigneePts + chelemPts;
        if (partieGagnee) { scorePreneur = total; scoreAppele = total; scoreDefense = -total; }
        else { scorePreneur = -total; scoreAppele = -total; scoreDefense = total; }
        scorePreneur = scorePreneur * 2;
      } else {
        let total = base + poigneePts + chelemPts;
        if (partieGagnee) { scorePreneur = total; scoreAppele = total; scoreDefense = -total; }
        else { scorePreneur = -total; scoreAppele = -total; scoreDefense = total; }
        scorePreneur = scorePreneur * 2;
      }

      return { preneurId, appeleId, contrat, bouts, points, petitBout, poignee, chelem,
        base, poigneePts, chelemPts, petitAuBoutPts, scorePreneur, scoreAppele, scoreDefense, partieGagnee };
    }

    function histPrevisualiserScore() {
      const res = histCalculerScore();
      const preview = document.getElementById("score-preview");
      const resultat = document.getElementById("score-resultat");
      if (!res) {
        preview.style.display = "block";
        resultat.innerHTML = '<span style="color: var(--accent2);">Veuillez saisir les points.</span>';
        return;
      }
      const preneur = joueurs.find(j => j.id === res.preneurId);
      const appele = res.appeleId ? joueurs.find(j => j.id === res.appeleId) : null;
      preview.style.display = "block";
      const statut = res.partieGagnee ? '✅ Gagnée' : '❌ Perdue';
      const couleur = res.partieGagnee ? 'var(--success)' : 'var(--accent2)';
      let html = `<strong style="color: ${couleur};">${statut}</strong><br>`;
      html += `${preneur ? preneur.nom : '?'} : <span class="${res.scorePreneur >= 0 ? 'score-positif' : 'score-negatif'}">${res.scorePreneur > 0 ? '+' : ''}${res.scorePreneur}</span><br>`;
      if (appele) {
        html += `${appele.nom} (appelé) : <span class="${res.scoreAppele >= 0 ? 'score-positif' : 'score-negatif'}">${res.scoreAppele > 0 ? '+' : ''}${res.scoreAppele}</span><br>`;
      }
      html += `Défense : <span class="${res.scoreDefense >= 0 ? 'score-positif' : 'score-negatif'}">${res.scoreDefense > 0 ? '+' : ''}${res.scoreDefense}</span>`;
      resultat.innerHTML = html;
    }

    function histValiderMene() {
      const res = histCalculerScore();
      if (!res) { alert("Veuillez saisir les points réalisés."); return; }
      const joueursList = histEnCours.joueursIds;
      const nonJoueur1 = document.getElementById("nonJoueur1")?.value ? parseInt(document.getElementById("nonJoueur1").value) : 0;
      const nonJoueur2 = document.getElementById("nonJoueur2")?.value ? parseInt(document.getElementById("nonJoueur2").value) : 0;

      const scores = [];
      joueursList.forEach(jid => {
        if (jid === nonJoueur1 || jid === nonJoueur2) { scores.push(0); }
        else if (jid === res.preneurId) { scores.push(res.scorePreneur); }
        else if (jid === res.appeleId) { scores.push(res.scoreAppele); }
        else { scores.push(res.scoreDefense); }
      });

      const somme = scores.reduce((a, b) => a + b, 0);
      if (somme !== 0) console.warn("Somme scores != 0:", somme);

      // Date ISO à partir de la date saisie (midi local pour éviter décalages)
      const dateObj = new Date(histEnCours.date + 'T12:00:00');

      const mene = {
        id: Date.now(),
        tableId: -1, // pas de table rattachée (historique)
        joueurs: [...joueursList],
        scores: scores,
        date: dateObj.toISOString(),
        contrat: res.contrat,
        bouts: res.bouts,
        points: res.points,
        petitBout: res.petitBout,
        poignee: res.poignee,
        chelem: res.chelem,
        appele: res.appeleId,
        nonJoueur1: nonJoueur1,
        nonJoueur2: nonJoueur2,
        preneur: res.preneurId,
        gagnee: res.partieGagnee,
        historique: true,
        lieu: histEnCours.lieu || ''
      };
      histEnCours.menes.push(mene);
      joueursList.forEach((jid, i) => {
        histEnCours.cumuls[jid] = (histEnCours.cumuls[jid] || 0) + scores[i];
      });
      renderSaisieHistorique();
    }

    function histValiderPartie() {
      if (histEnCours.menes.length === 0) { alert("Aucune mène à valider."); return; }
      // Ajouter directement les mènes au tableau global
      menes.push(...histEnCours.menes);
      saveData();
      fermerSaisie();
      alert("✅ Partie historique validée ! Les résultats apparaîtront dans les filtres Jour/Mois/Saison.");
    }

    // ========== EXPORT PDF ==========
    // Generateur PDF minimal sans bibliotheque externe
    function genererPDFSimple(classement, periodeTexte) {
      var lines = [];
      // En PDF, l'origine (0,0) est en bas a gauche. A4 = 595x842 pts.
      // On commence en haut : y=800
      var y = 800;

      function esc(s) {
        return String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
      }

      // Titre
      lines.push('BT /F1 18 Tf 50 ' + y + ' Td (ABJE Tarot - Resultats) Tj ET');
      y -= 20;
      lines.push('BT /F1 11 Tf 50 ' + y + ' Td (Periode : ' + esc(periodeTexte) + ') Tj ET');
      y -= 16;
      lines.push('BT /F1 11 Tf 50 ' + y + ' Td (Joueurs : ' + classement.length + ') Tj ET');
      y -= 24;

      // Titre classement
      lines.push('BT /F1 13 Tf 50 ' + y + ' Td (Classement) Tj ET');
      y -= 20;

      // Podium
      if (classement.length >= 1) {
        lines.push('BT /F1 11 Tf 50 ' + y + ' Td (1er : ' + esc(classement[0].nom) + ' (' + (classement[0].total >= 0 ? '+' : '') + classement[0].total + ')) Tj ET');
        y -= 16;
      }
      if (classement.length >= 2) {
        lines.push('BT /F1 11 Tf 50 ' + y + ' Td (2eme : ' + esc(classement[1].nom) + ' (' + (classement[1].total >= 0 ? '+' : '') + classement[1].total + ')) Tj ET');
        y -= 16;
      }
      if (classement.length >= 3) {
        lines.push('BT /F1 11 Tf 50 ' + y + ' Td (3eme : ' + esc(classement[2].nom) + ' (' + (classement[2].total >= 0 ? '+' : '') + classement[2].total + ')) Tj ET');
        y -= 16;
      }
      y -= 10;

      // En-tete tableau
      lines.push('BT /F1 10 Tf 50 ' + y + ' Td (#   Joueur               Total  Prises  Reussites  Taux) Tj ET');
      y -= 4;
      lines.push('50 ' + y + ' m 545 ' + y + ' l 0.5 w S'); // ligne sous en-tete
      y -= 16;

      // Lignes du classement
      classement.forEach(function(j, index) {
        var taux = j.prises > 0 ? Math.round((j.reussites / j.prises) * 100) + '%' : '-';
        var total = (j.total >= 0 ? '+' : '') + j.total;
        var nom = j.nom;
        while (nom.length < 18) nom += ' ';
        var ligne = (index + 1) + '.  ' + nom + ' ' + total;
        while (ligne.length < 30) ligne += ' ';
        ligne += j.prises + '       ' + j.reussites + '         ' + taux;
        lines.push('BT /F1 10 Tf 50 ' + y + ' Td (' + esc(ligne) + ') Tj ET');
        y -= 14;
      });

      // Pied de page
      y -= 20;
      lines.push('BT /F1 8 Tf 50 ' + y + ' Td (Edite le ' + esc(formatDateLong(new Date())) + ' a ' + esc(new Date().toLocaleTimeString('fr-FR')) + ') Tj ET');

      // Construire le PDF binaire
      var content = lines.join('\n');
      var objects = [];
      objects.push('<< /Type /Catalog /Pages 2 0 R >>');
      objects.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
      objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>');
      objects.push('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
      objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');

      var pdf = '%PDF-1.4\n';
      var offsets = [];
      objects.forEach(function(obj, i) {
        offsets.push(pdf.length);
        pdf += (i + 1) + ' 0 obj\n' + obj + '\nendobj\n';
      });

      var xrefStart = pdf.length;
      pdf += 'xref\n0 ' + (objects.length + 1) + '\n';
      pdf += '0000000000 65535 f \n';
      offsets.forEach(function(off) {
        pdf += ('0000000000' + off).slice(-10) + ' 00000 n \n';
      });
      pdf += 'trailer\n<< /Size ' + (objects.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';

      return pdf;
    }

    function exportPDF() {
      // Demander la periode
      var choix = '0';
      try {
        choix = prompt(
          "Quelle periode exporter ?\n\n" +
          "1 = Jour (aujourd'hui)\n" +
          "2 = Mois (ce mois-ci)\n" +
          "3 = Saison en cours\n" +
          "0 = TOUTES les parties\n\n" +
          "Tapez le chiffre :",
          "0"
        );
      } catch(e) { choix = '0'; }
      if (choix === null) return;

      var menesFiltres;
      var periodeTexte;

      if (choix === '1') {
        var aujStr = new Date().toDateString();
        menesFiltres = menes.filter(function(m) { return new Date(m.date).toDateString() === aujStr; });
        periodeTexte = formatDateLong(new Date());
      } else if (choix === '2') {
        var now = new Date();
        menesFiltres = menes.filter(function(m) {
          var d = new Date(m.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });
        periodeTexte = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'][now.getMonth()] + ' ' + now.getFullYear();
      } else if (choix === '3') {
        var saison = getSaisonActuelle();
        if (!saison) { alert("Aucune saison en cours."); return; }
        var debut = new Date(saison.dateDebut); debut.setHours(0,0,0,0);
        var fin = new Date(saison.dateFin); fin.setHours(23,59,59,999);
        menesFiltres = menes.filter(function(m) {
          var d = new Date(m.date);
          return d >= debut && d <= fin;
        });
        periodeTexte = saison.nom;
      } else {
        menesFiltres = menes.slice();
        periodeTexte = "Toutes les parties";
      }

      if (menesFiltres.length === 0) {
        alert("Aucune partie a exporter.");
        return;
      }

      // Calculer le classement
      var stats = {};
      menesFiltres.forEach(function(mene) {
        mene.joueurs.forEach(function(joueurId, index) {
          var joueur = joueurs.find(function(j) { return j.id === joueurId; });
          if (!joueur) return;
          if (!stats[joueurId]) {
            stats[joueurId] = { nom: joueur.nom, total: 0, prises: 0, reussites: 0 };
          }
          stats[joueurId].total += mene.scores[index];
          if (mene.preneur === joueurId) {
            stats[joueurId].prises++;
            if (mene.gagnee) stats[joueurId].reussites++;
          }
        });
      });
      var classement = Object.values(stats).sort(function(a, b) { return b.total - a.total; });

      // Generer le PDF
      var pdfContent = genererPDFSimple(classement, periodeTexte);
      var dateStr = toDateInput(new Date());
      var nomFichier = 'abje_tarot_resultats_' + dateStr + '.pdf';

      // Convertir en Blob et telecharger
      var blob = new Blob([pdfContent], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);

      // Essayer showSaveFilePicker (Chrome/Edge : choix du dossier)
      if (window.showSaveFilePicker) {
        window.showSaveFilePicker({
          suggestedName: nomFichier,
          types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }]
        }).then(function(handle) {
          return handle.createWritable();
        }).then(function(writable) {
          return writable.write(blob).then(function() { return writable.close(); });
        }).then(function() {
          URL.revokeObjectURL(url);
          alert('PDF enregistre : ' + nomFichier);
        }).catch(function(err) {
          // Annule ou erreur : fallback telechargement simple
          if (err.name !== 'AbortError') {
            telechargerPDF(url, nomFichier);
          }
        });
      } else {
        // Firefox et autres : telechargement simple
        telechargerPDF(url, nomFichier);
      }
    }

    function telechargerPDF(url, nomFichier) {
      var a = document.createElement('a');
      a.href = url;
      a.download = nomFichier;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 3000);
    }

    function restaurerDepuisTextarea() {

        alert('Collez le contenu JSON de la sauvegarde.');
        return;

        const data = JSON.parse(jsonStr);
        if (!data.joueurs || !data.menes) {
          alert("Fichier invalide : format de sauvegarde non reconnu.");
          return;
        }
        if (!confirm('Restaurer la base ? Cela remplacera toutes les donnees actuelles.')) return;
        joueurs = data.joueurs || [];

        menes = data.menes || [];
        parties = data.parties || [];
        saisons = data.saisons || [];
        saveData();

        renderApp();
      } catch (err) {
        alert("Erreur : " + err.message);
      }
    }

    function restaurerDepuisFichier(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.joueurs || !data.menes) {
            alert("Fichier invalide : format de sauvegarde non reconnu.");
            return;
          }
          if (!confirm('Restaurer la base ? Cela remplacera toutes les donnees actuelles.')) return;
          joueurs = data.joueurs || [];
          tables = data.tables || [];
          menes = data.menes || [];
          parties = data.parties || [];
          saisons = data.saisons || [];
          saveData();
          alert('Base restauree avec succes !');
          renderApp();
        } catch (err) {
          alert("Erreur : " + err.message);
        }
      };
      reader.readAsText(file);
    }

        ${tableHtml}
      `;
    }

    function filtrerMenesPeriode() {
      const now = new Date();
      if (resultatsPeriode === 'jour') {
        const aujStr = now.toDateString();
        return menes.filter(m => new Date(m.date).toDateString() === aujStr);
      } else if (resultatsPeriode === 'mois') {
        return menes.filter(m => {
          const d = new Date(m.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });
      } else {
        if (!resultatsSaisonId) return [];
        const saison = getSaisonById(parseInt(resultatsSaisonId));
        if (!saison) return [];
        const debut = new Date(saison.dateDebut);
        debut.setHours(0, 0, 0, 0);
        const fin = new Date(saison.dateFin);
        fin.setHours(23, 59, 59, 999);
        return menes.filter(m => {
          const d = new Date(m.date);
          return d >= debut && d <= fin;
        });
      }
    }

    function getPeriodeTexte() {
      if (resultatsPeriode === 'jour') {
        return `📅 ${formatDateLong(new Date())}`;
      } else if (resultatsPeriode === 'mois') {
        const mois = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
        const now = new Date();
        return `📆 ${mois[now.getMonth()]} ${now.getFullYear()}`;
      } else {
        if (!resultatsSaisonId) return "🏆 Aucune saison sélectionnée";
        const saison = getSaisonById(parseInt(resultatsSaisonId));
        if (!saison) return "🏆 Saison introuvable";
        return `🏆 ${saison.nom} (${formatDateCourte(saison.dateDebut)} → ${formatDateCourte(saison.dateFin)})`;
      }
    }

    function changerPeriodeResultats(periode) {
      resultatsPeriode = periode;
      document.querySelectorAll('.periode-tab').forEach(t => t.classList.remove('active'));
      const tabs = document.querySelectorAll('.periode-tab');
      if (periode === 'jour' && tabs[0]) tabs[0].classList.add('active');
      else if (periode === 'mois' && tabs[1]) tabs[1].classList.add('active');
      else if (periode === 'saison' && tabs[2]) tabs[2].classList.add('active');
      const el = document.getElementById('resultats-content');
      if (el) el.innerHTML = renderResultatsContent();
    }

    function changerSaisonResultats(saisonId) {
      resultatsSaisonId = saisonId ? parseInt(saisonId) : null;
      const el = document.getElementById('resultats-content');
      if (el) el.innerHTML = renderResultatsContent();
    }

    // ========== FONCTIONS PRINCIPALES ==========
    function renderApp() {
      if (!user) {
        renderLogin();
      } else {
        document.getElementById("nav-tabs").style.display = "flex";
        document.getElementById("logout-btn").style.display = "block";
        document.getElementById("logout-btn").onclick = logout;
        showTab('accueil');
      }
    }
    function logout() {
      user = null;
      saveData();
      renderLogin();
    }
    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
