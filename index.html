    // ========== FONCTIONS UTILITAIRES ==========
    function formatDateFR(d) {
      if (typeof d === "string") d = new Date(d);
      const opts = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
      return d.toLocaleDateString("fr-FR", opts);
    }

    function dateKey(d) {
      if (typeof d === "string") return d;
      return d.toISOString().split("T")[0];
    }

    function monthKey(d) {
      if (typeof d === "string") d = new Date(d);
      const m = (d.getMonth() + 1).toString().padStart(2, "0");
      return d.getFullYear() + "-" + m;
    }

    // ========== FONCTIONS DE CALCUL (votre code existant) ==========
    const CONTRATS = {
      "Petite": { mult: 1, label: "Petite" },
      "Garde": { mult: 2, label: "Garde" },
      "Garde sans": { mult: 4, label: "Garde sans" },
      "Garde contre": { mult: 6, label: "Garde contre" },
    };

    function getContratsForTable(nbJoueurs) {
      if (nbJoueurs === 4) return ["Petite", "Garde", "Garde sans", "Garde contre"];
      return ["Garde", "Garde sans", "Garde contre"];
    }

    const POIGNEES = {
      "Aucune": 0,
      "Simple": 20,
      "Double": 30,
      "Triple": 40,
    };

    function calculerScore(mene) {
      const contrat = CONTRATS[mene.contrat];
      if (!contrat) return { preneur: 0, defense: 0, details: "Contrat invalide" };

      const seuils = { 0: 56, 1: 51, 2: 41, 3: 36 };
      const nbBouts = mene.nbBouts || 0;
      const seuil = seuils[nbBouts] || 56;
      const diff = (mene.pointsRealises || 0) - seuil;

      let base = 25 + diff;

      let petitAuBoutPts = 0;
      if (mene.petitAuBout === "preneur") {
        petitAuBoutPts = 10;
        base += petitAuBoutPts;
      } else if (mene.petitAuBout === "defense") {
        petitAuBoutPts = 10;
        base -= petitAuBoutPts;
      }

      let scoreContrat = base * contrat.mult;
      scoreContrat = Math.round(scoreContrat / 10) * 10;

      const poigneePts = POIGNEES[mene.poignee] || 0;
      let bonusPoignee = 0;
      if (poigneePts > 0) {
        if (mene.poigneeSide === "preneur") {
          bonusPoignee = poigneePts;
        } else if (mene.poigneeSide === "defense") {
          bonusPoignee = -poigneePts;
        }
      }

      let bonusChelem = 0;
      if (mene.chelem === "non_demande") bonusChelem = 200;
      else if (mene.chelem === "demande_reussi") bonusChelem = 400;
      else if (mene.chelem === "demande_perdu") bonusChelem = -400;

      let scoreTotal = scoreContrat + bonusPoignee + bonusChelem;
      const gagne = diff >= 0;
      let preneurScore, defenseScore;

      if (gagne) {
        preneurScore = scoreTotal;
        defenseScore = -scoreTotal;
      } else {
        preneurScore = -scoreTotal;
        defenseScore = scoreTotal;
      }

      const detailParts = [
        `25 + (${mene.pointsRealises || 0} - ${seuil}) = ${base}`,
        `x ${contrat.mult} -> ${scoreContrat}`,
      ];
      if (petitAuBoutPts) detailParts.push(`Petit bout: ${mene.petitAuBout === "preneur" ? "+" : "-"}${petitAuBoutPts}`);
      if (poigneePts) detailParts.push(`Poignee: ${mene.poignee} (${mene.poigneeSide || "preneur"}) ${bonusPoignee > 0 ? "+" : ""}${bonusPoignee}`);
      if (bonusChelem) detailParts.push(`Chelem: ${bonusChelem > 0 ? "+" : ""}${bonusChelem}`);
      detailParts.push(`= ${gagne ? "+" : "-"}${Math.abs(scoreTotal)} (${gagne ? "gagne" : "perdu"})`);

      return {
        preneur: preneurScore,
        defense: defenseScore,
        gagne,
        scoreContrat,
        details: detailParts.join(" - "),
      };
    }

    function getScoresParJoueur(mene, nbJoueurs) {
      const result = calculerScore(mene);
      const score = result.preneur;
      const hasAppele = mene.appele && mene.appele !== "aucun";

      const scores = {};

      if (nbJoueurs === 4) {
        if (mene.preneur) scores[mene.preneur] = Math.round(score * 3);
        scores._defense = -Math.round(score);
        scores._nbDefense = 3;
      } else if (hasAppele) {
        if (mene.preneur) scores[mene.preneur] = Math.round(score * 2);
        if (mene.appele) scores[mene.appele] = Math.round(score * 1);
        const nbDefense = nbJoueurs - 2;
        scores._defense = -Math.round(score);
        scores._nbDefense = nbDefense;
      } else {
        if (mene.preneur) scores[mene.preneur] = Math.round(score * 4);
        const nbDefense = nbJoueurs - 1;
        scores._defense = -Math.round(score);
        scores._nbDefense = nbDefense;
      }

      return { scores, gagne: result.gagne, details: result.details };
    }

    // ========== APP PRINCIPALE (votre code existant) ==========
    function App() {
      const [session, setSession] = React.useState(null);

      // Chargement de l'état depuis localStorage
      const loadState = () => {
        try {
          const raw = localStorage.getItem("abje_tarot_data");
          if (raw) {
            const data = JSON.parse(raw);
            return {
              joueurs: data.joueurs || [],
              tables: data.tables || [],
              menes: data.menes || {},
              tableCounter: data.tableCounter || 0,
              partiesValidees: data.partiesValidees || {},
            };
          }
        } catch (e) { /* ignore */ }
        return { joueurs: [], tables: [], menes: {}, tableCounter: 0, partiesValidees: {} };
      };

      const initial = loadState();
      const [joueurs, setJoueurs] = React.useState(initial.joueurs);
      const [tables, setTables] = React.useState(initial.tables);
      const [menes, setMenes] = React.useState(initial.menes);
      const [tableCounter, setTableCounter] = React.useState(initial.tableCounter);
      const [partiesValidees, setPartiesValidees] = React.useState(initial.partiesValidees);

      // Sauvegarde automatique
      React.useEffect(() => {
        try {
          localStorage.setItem("abje_tarot_data", JSON.stringify({ joueurs, tables, menes, tableCounter, partiesValidees }));
        } catch (e) { /* ignore */ }
      }, [joueurs, tables, menes, tableCounter, partiesValidees]);

      if (!session) {
        return <LoginScreen onLogin={setSession} />;
      }

      return (
        <MainApp
          session={session}
          onLogout={() => setSession(null)}
          joueurs={joueurs}
          setJoueurs={setJoueurs}
          tables={tables}
          setTables={setTables}
          menes={menes}
          setMenes={setMenes}
          tableCounter={tableCounter}
          setTableCounter={setTableCounter}
          partiesValidees={partiesValidees}
          setPartiesValidees={setPartiesValidees}
        />
      );
    }

    // ========== MAIN APP (votre code existant) ==========
    function MainApp({
      session, onLogout,
      joueurs, setJoueurs,
      tables, setTables,
      menes, setMenes,
      tableCounter, setTableCounter,
      partiesValidees, setPartiesValidees,
    }) {
      const [tab, setTab] = React.useState("accueil");
      const isAdmin = session.role === "admin";
      const todayKey = dateKey(new Date());

      const tabs = [
        { id: "accueil", label: "Accueil", icon: "🏠" },
        { id: "joueurs", label: "Joueurs", icon: "👥" },
        { id: "tables", label: "Tables", icon: "🃏" },
        { id: "saisies", label: "Saisies", icon: "✏️" },
        { id: "resultats", label: "Résultats", icon: "🏆" },
      ];

      return (
        <div
          style={{
            minHeight: "100vh",
            background: `linear-gradient(135deg, ${COLORS.bg} 0%, ${COLORS.bg2} 50%, ${COLORS.bg3} 100%)`,
            fontFamily: "system-ui, -apple-system, sans-serif",
            color: COLORS.text,
            display: "flex",
            flexDirection: "column",
          }}
        >
          <style>{`
            @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
            @keyframes fadeIn { from{opacity:0} to{opacity:1} }
            .scroll-y { -webkit-overflow-scrolling: touch; }
          `}</style>

          {/* En-tête */}
          <header
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              padding: "16px 20px",
              borderBottom: `1px solid ${COLORS.border}`,
              background: COLORS.cardBg,
              position: "sticky",
              top: 0,
              zIndex: 100,
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <div
                style={{
                  width: "40px",
                  height: "40px",
                  borderRadius: "10px",
                  background: `linear-gradient(135deg, ${COLORS.accent1}, ${COLORS.accent2})`,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: "18px",
                  fontWeight: 800,
                  color: "white",
                }}
              >
                A
              </div>
              <div>
                <div style={{ fontSize: "18px", fontWeight: 700 }}>ABJE</div>
                <div style={{ fontSize: "11px", color: COLORS.textMuted }}>
                  {isAdmin ? "Admin" : "ABJE"} · {formatDateFR(new Date())}
                </div>
              </div>
            </div>
            <button
              onClick={onLogout}
              style={{
                padding: "8px 14px",
                borderRadius: "8px",
                border: `1px solid ${COLORS.border}`,
                background: "transparent",
                color: COLORS.textMuted,
                fontSize: "13px",
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              Déconnexion
            </button>
          </header>

          {/* Barre d'onglets */}
          <nav
            style={{
              display: "flex",
              justifyContent: "space-around",
              padding: "6px 4px",
              background: COLORS.cardBg,
              borderBottom: `1px solid ${COLORS.border}`,
              position: "sticky",
              top: 0,
              zIndex: 99,
              maxWidth: "600px",
              margin: "0 auto",
              width: "100%",
            }}
          >
            {tabs.map((t) => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                style={{
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: "2px",
                  padding: "6px 10px",
                  background: "transparent",
                  border: "none",
                  cursor: "pointer",
                  fontSize: "10px",
                  fontWeight: 600,
                  color: tab === t.id ? COLORS.accent1 : COLORS.textMuted,
                  transition: "color 0.2s",
                }}
              >
                <span style={{ fontSize: "20px" }}>{t.icon}</span>
                {t.label}
              </button>
            ))}
          </nav>

          {/* Contenu */}
          <div style={{ flex: 1, padding: "16px", maxWidth: "600px", width: "100%", margin: "0 auto" }}>
            {tab === "accueil" && <AccueilTab onNavigate={setTab} />}
            {tab === "joueurs" && (
              <JoueursTab
                joueurs={joueurs}
                setJoueurs={setJoueurs}
                isAdmin={isAdmin}
              />
            )}
            {tab === "tables" && (
              <TablesTab
                joueurs={joueurs}
                setJoueurs={setJoueurs}
                tables={tables}
                setTables={setTables}
                tableCounter={tableCounter}
                setTableCounter={setTableCounter}
                todayKey={todayKey}
                isAdmin={isAdmin}
              />
            )}
            {tab === "saisies" && (
              <SaisiesTab
                tables={tables}
                menes={menes}
                setMenes={setMenes}
                joueurs={joueurs}
                partiesValidees={partiesValidees}
                setPartiesValidees={setPartiesValidees}
                isAdmin={isAdmin}
              />
            )}
