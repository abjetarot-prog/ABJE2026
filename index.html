<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    h1, h2, h3 {
      margin: 0 0 1rem 0;
      color: var(--text);
      font-weight: 700;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin: 0.5rem 0;
    }
    .error {
      color: var(--accent2);
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
    }
    .login-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    /* Style pour les onglets actifs */
.nav-tab.active {
  color: var(--accent1) !important;
  border-bottom: 3px solid var(--accent1) !important;
  background: rgba(245, 158, 11, 0.1) !important;
}

/* Animation au survol */
.nav-tab {
  transition: all 0.2s ease;
}
.nav-tab:hover {
  background: rgba(255, 255, 255, 0.05);
  transform: translateY(-2px);
}
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <span>ABJE Tarot</span>
    </div>
    <button id="logout-btn" class="btn-ghost" style="display: none;">Déconnexion</button>
  </header>
  <nav id="nav-tabs" style="display: none;">
    <button class="nav-tab active" data-tab="accueil" onclick="showTab('accueil')">🏠 Accueil</button>
    <button class="nav-tab" data-tab="joueurs" onclick="showTab('joueurs')">👥 Joueurs</button>
    <button class="nav-tab" data-tab="tables" onclick="showTab('tables')">🎲 Tables</button>
    <button class="nav-tab" data-tab="saisie" onclick="showTab('saisie')">✏️ Saisie</button>
    <button class="nav-tab" data-tab="resultats" onclick="showTab('resultats')">🏆 Résultats</button>
    
  </nav>

  <main id="app"></main>
 
  <script>
    // ========== CONSTANTES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
        let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "1", nom: "Tarot ABJE", disponible: false },
      { id: "2", nom: "Joueur 2", disponible: false },
      { id: "3", nom: "Joueur 3", disponible: false },
      { id: "4", nom: "Joueur 4", disponible: false }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];
let menes = JSON.parse(localStorage.getItem("abje_menes")) || []; 
    
    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables)); 
      localStorage.setItem("abje_menes", JSON.stringify(menes));
            }

    // ========== RENDU ==========
    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <div class="login-container">
          <div class="login-icon">🃏</div>
          <h1>ABJE Tarot</h1>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Gestion de club de Tarot</p>
          <form id="loginForm">
            <input type="text" id="login" placeholder="Login (admin/abje)" required autocomplete="username">
            <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
            <div id="loginError" class="error"></div>
            <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = function(e) {
        e.preventDefault();
        const login = document.getElementById("login").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("loginError");

        if ((login === "admin" && password === ADMIN_PASSWORD) || (login === "abje" && password === ABJE_PASSWORD)) {
          user = { role: login };
          errorEl.textContent = "";
          saveData();
          renderApp();
        } else {
          errorEl.textContent = "Login ou mot de passe incorrect";
        }
      };
    }

    function renderApp() {
  if (!user) {
    renderLogin();
    document.getElementById("nav-tabs").style.display = "none";
    document.getElementById("logout-btn").style.display = "none";
  } else {
    document.getElementById("nav-tabs").style.display = "flex";
    document.getElementById("logout-btn").style.display = "block";

    // CORRECTION: Initialiser les événements des onglets
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.onclick = () => showTab(tab.dataset.tab);
    });

    document.getElementById("logout-btn").onclick = () => {
      user = null;
      saveData();
      renderApp();
    };

    renderContent("accueil");
  }
}
function showTab(tab) {
  // Mettre à jour l'onglet actif
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

  // Charger le contenu
  const contentMap = {
    accueil: renderAccueil,
    joueurs: renderJoueurs,
    tables: renderTables,
    saisie: renderSaisie,
    resultats: renderResultats
  };

  if (contentMap[tab]) {
    contentMap[tab]();
  } else {
    console.error(`Onglet "${tab}" introuvable.`);
  }
}
// Fonction pour rendre le contenu de l'onglet
function renderContent(tab) {
  const contentMap = {
    accueil: renderAccueil,
    joueurs: renderJoueurs,
    tables: renderTables,
    saisie: renderSaisie,
    resultats: renderResultats
  };

  // Vérifier que l'onglet existe
  if (contentMap[tab]) {
    try {
      contentMap[tab]();
    } catch (error) {
      console.error(`Erreur lors du rendu de l'onglet "${tab}":`, error);
      document.getElementById("app").innerHTML = `
        <div class="card" style="color: var(--accent2);">
          <h3>⚠️ Erreur</h3>
          <p>Impossible de charger l'onglet <strong>${tab}</strong>.</p>
          <button onclick="showTab('accueil')" class="btn-primary">Retour à l'accueil</button>
        </div>
      `;
    }
  } else {
    // Onglet inconnu : retourner à l'accueil
    showTab('accueil');
  }
}

function renderAccueil() {
  document.getElementById("app").innerHTML = `
    <div class="card" style="text-align: center;">
      <h2>Bienvenue sur ABJE Tarot !</h2>
      <p>Connecté en tant que <strong>${user.role}</strong></p>

      <!-- Section QR Code -->
      <div style="margin: 1.5rem 0; padding: 1rem; background: var(--bg); border-radius: 0.75rem; border: 1px solid var(--border);">
        <p style="margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--text-muted);">Accès mobile :</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(APP_URL)}&bgcolor=1e293b&color=f8fafc"
             alt="QR Code ABJE Tarot" width="140" style="border-radius: 0.5rem; border: 2px solid var(--border); margin: 0 auto; display: block;">
        <p style="margin-top: 0.75rem; font-size: 0.8rem;">
          <a href="${APP_URL}" style="color: var(--accent4);" target="_blank">${APP_URL.replace('https://', '')}</a>
        </p>
        <button onclick="navigator.clipboard.writeText('${APP_URL}').then(() => alert('✅ Lien copié !'))"
                class="btn-ghost" style="font-size: 0.8rem; margin-top: 0.5rem;">Copier</button>
      </div>
    </div>

    <!-- Section Navigation -->
    <div class="card">
      <h3>🎯 Menu principal</h3>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;">
        <button onclick="showTab('joueurs')" class="btn-primary" style="padding: 0.75rem; font-size: 0.9rem;">
          👥 Joueurs (${joueurs.length})
        </button>
        <button onclick="showTab('tables')" class="btn-primary" style="padding: 0.75rem; font-size: 0.9rem;">
          🎲 Tables (${tables.length})
        </button>
        <button onclick="showTab('saisie')" class="btn-primary" style="padding: 0.75rem; font-size: 0.9rem;">
          ✏️ Saisie
        </button>
        <button onclick="showTab('resultats')" class="btn-primary" style="padding: 0.75rem; font-size: 0.9rem;">
          🏆 Résultats
        </button>
      </div>
    </div>
  `;
}
    function renderJoueurs() {
  document.getElementById("app").innerHTML = `
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>👥 Joueurs (${joueurs.length})</h2>
        <button onclick="showAddJoueur()" class="btn-success">+ Nouveau</button>
      </div>

      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <button onclick="cocherTousPresents()" class="btn-ghost" style="flex: 1;">✅ Tout cocher</button>
        <button onclick="decocherTousPresents()" class="btn-ghost" style="flex: 1;">☐ Tout décocher</button>
      </div>

      <div class="player-grid">
        ${joueurs.map(j => `
          <div class="player-card">
            <div>
              <div class="player-name">${j.nom}</div>
              <div class="player-status">${j.disponible ? "✅ Disponible" : "❌ Non disponible"}</div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button onclick="toggleDispo('${j.id}')" class="btn-ghost" style="padding: 0.25rem;">${j.disponible ? "Retirer" : "Ajouter"}</button>
              <button onclick="deleteJoueur('${j.id}')" class="btn-danger" style="padding: 0.25rem;">×</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
    // Fonction pour afficher le modal d'ajout de joueur
function showAddJoueur() {
  const nom = prompt("Nom du nouveau joueur :");
  if (nom && nom.trim()) {
    joueurs.push({ id: Date.now().toString(), nom: nom.trim(), disponible: false });
    saveData();
    renderJoueurs();
  }
}

// Fonction pour basculer la disponibilité d'un joueur
function toggleDispo(id) {
  joueurs = joueurs.map(j => j.id === id ? { ...j, disponible: !j.disponible } : j);
  saveData();
  renderJoueurs();
}

// Fonction pour supprimer un joueur
function deleteJoueur(id) {
  if (confirm("Êtes-vous sûr de vouloir supprimer ce joueur ?")) {
    joueurs = joueurs.filter(j => j.id !== id);
    saveData();
    renderJoueurs();
  }
}

// Fonction pour cocher tous les joueurs comme disponibles
function cocherTousPresents() {
  joueurs = joueurs.map(j => ({ ...j, disponible: true }));
  saveData();
  renderJoueurs();
}

// Fonction pour décocher tous les joueurs
function decocherTousPresents() {
  joueurs = joueurs.map(j => ({ ...j, disponible: false }));
  saveData();
  renderJoueurs();
}
// Fonction pour l'onglet Tables
function renderTables() {
  document.getElementById("app").innerHTML = `
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>🎲 Tables (${tables.length})</h2>
        <button onclick="showCreateTable()" class="btn-primary">+ Nouvelle table</button>
      </div>
      ${tables.length === 0 ? `
        <div class="card" style="text-align: center;">
          <p>Aucune table créée.</p>
        </div>
      ` : tables.map(t => `
        <div class="card">
          <h3>Table n°${t.numero} (${t.nbJoueurs} joueurs)</h3>

          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">

  `<button class="btn-ghost" style="flex: 1; opacity: 0.5; cursor: not-allowed;">Table pleine</button>` :

}
            <button onclick="deleteTable('${t.id}')" class="btn-danger" style="flex: 1;">Supprimer</button>
          </div>

      `).join('')}

// Fonction pour l'onglet Saisie
function renderSaisie() {
// Fonction pour l'onglet Saisie
function renderSaisie() {
  // Filtrer les tables avec des joueurs affectés
  const tablesAvecJoueurs = tables.filter(t => t.joueursAffectes && t.joueursAffectes.length > 0);
  
  if (tablesAvecJoueurs.length === 0) {
    document.getElementById("app").innerHTML = `
      <div class="card" style="text-align: center;">
        <h2>✏️ Saisie des résultats</h2>
        <p>Aucune table avec des joueurs affectés.</p>
        <p>Créez une table et affectez des joueurs d'abord.</p>
      </div>
    `;
    return;
  }

  // Générer le HTML pour la saisie
  let html = `
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>✏️ Saisie des résultats</h2>
        <button onclick="showNewMene()" class="btn-primary">+ Nouvelle mène</button>
      </div>
      <div id="mene-list">
  `;

  // Ajouter les mène existantes (si vous en avez déjà)
  if (localStorage.getItem("abje_menes")) {
    const menes = JSON.parse(localStorage.getItem("abje_menes")) || [];
    menes.forEach((mene, index) => {
      html += `
        <div class="card" style="margin-bottom: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <h3>Mène n°${index + 1} - Table n°${mene.tableNumero}</h3>
            <button onclick="deleteMene(${index})" class="btn-danger" style="padding: 0.25rem 0.5rem;">×</button>
          </div>
          <p>Date: ${new Date(mene.date).toLocaleString('fr-FR')}</p>
          <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 0.5rem;">
      `;

      // Afficher les scores des 5 joueurs
      for (let i = 0; i < 5; i++) {
        const joueur = joueurs.find(j => j.id === mene.joueurs[i]);
        html += `
          <div style="text-align: center; padding: 0.5rem; background: var(--bg); border-radius: 0.5rem;">
            <div style="font-weight: bold; font-size: 0.8rem;">${joueur ? joueur.nom : '—'}</div>
            <div style="color: ${mene.scores[i] >= 0 ? 'var(--accent4)' : 'var(--accent2)'};">${mene.scores[i] >= 0 ? '+' : ''}${mene.scores[i]}</div>
          </div>
        `;
      }

      html += `
          </div>
          <p style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">Total: ${mene.scores.reduce((a, b) => a + b, 0)}</p>
        </div>
      `;
    });
  } else {
    html += `<p style="text-align: center; color: var(--text-muted);">Aucune mène enregistrée.</p>`;
  }

  html += `
      </div>
    </div>
  `;

  document.getElementById("app").innerHTML = html;
}

// Fonction pour ajouter une nouvelle mène
function showNewMene() {
  const tablesAvecJoueurs = tables.filter(t => t.joueursAffectes && t.joueursAffectes.length === t.nbJoueurs);

  if (tablesAvecJoueurs.length === 0) {
    alert("Aucune table complète (5 joueurs) n'est prête pour une mène !");
    return;
  }

  // Demander quelle table utiliser
  let message = "Sélectionnez une table pour la nouvelle mène :\n\n";
  tablesAvecJoueurs.forEach((t, index) => {
    message += `${index + 1}. Table n°${t.numero} (${t.nbJoueurs} joueurs: ${t.joueursAffectes.map(id => joueurs.find(j => j.id === id).nom).join(', ')})\n`;
  });

  const choixTable = prompt(message + "\n(Entrez le numéro ou 'annuler')");
  if (choixTable === null || choixTable.toLowerCase() === "annuler") return;

  const tableIndex = parseInt(choixTable) - 1;
  if (tableIndex < 0 || tableIndex >= tablesAvecJoueurs.length) {
    alert("Numéro de table invalide !");
    return;
  }

  const selectedTable = tablesAvecJoueurs[tableIndex];

  // Demander les scores pour chaque joueur
  const scores = [];
  for (let i = 0; i < selectedTable.nbJoueurs; i++) {
    const joueur = joueurs.find(j => j.id === selectedTable.joueursAffectes[i]);
    let score;
    do {
      score = prompt(`Score de ${joueur.nom} (ex: +50, -25, 0):`);
      if (score === null) return; // Annuler
      score = parseInt(score.replace('+', ''));
      if (isNaN(score)) {
        alert("Veuillez entrer un nombre valide (ex: 50, -25, 0)");
      }
    } while (isNaN(score));
    scores.push(score);
  }

  // Créer la nouvelle mène
  const menes = JSON.parse(localStorage.getItem("abje_menes")) || [];
  menes.push({
    id: Date.now().toString(),
    tableId: selectedTable.id,
    tableNumero: selectedTable.numero,
    joueurs: selectedTable.joueursAffectes,
    scores: scores,
    date: new Date().toISOString()
  });

  localStorage.setItem("abje_menes", JSON.stringify(menes));
  renderSaisie();
  alert("✅ Mène enregistrée avec succès !");
}

// Fonction pour supprimer une mène
function deleteMene(index) {
  if (confirm("Êtes-vous sûr de vouloir supprimer cette mène ?")) {
    const menes = JSON.parse(localStorage.getItem("abje_menes")) || [];
    menes.splice(index, 1);
    localStorage.setItem("abje_menes", JSON.stringify(menes));
    renderSaisie();
  }
}

// Fonction pour l'onglet Résultats
function renderResultats() {

    <div class="card">

      <p>Fonctionnalité à implémenter.</p>

    </div>

// Fonction pour créer une table
function showCreateTable() {
  const nbJoueurs = prompt("Nombre de joueurs (4-7) :");
  if (nbJoueurs && [4,5,6,7].includes(parseInt(nbJoueurs))) {
    const tableCounter = tables.length + 1;
    tables.push({
      id: Date.now().toString(),
      numero: tableCounter,
      nbJoueurs: parseInt(nbJoueurs),
      joueursAffectes: []
    });
    saveData();
    renderTables();
  }
}
// Fonction pour affecter des joueurs à une table
// Fonction pour afficher un modal d'affectation avec cases à cocher
function affecterJoueursATable(tableId) {
  const table = tables.find(t => t.id === tableId);
  if (!table) return;
  
  // Initialiser joueursAffectes si vide
  if (!table.joueursAffectes) {
    table.joueursAffectes = [];
  }

  // Vérifier si la table est pleine
  if (table.joueursAffectes.length >= table.nbJoueurs) {
    alert(`Cette table est déjà complète (${table.nbJoueurs} joueurs max).`);
    return;
  }

  // Filtrer les joueurs disponibles et non déjà affectés
  const joueursDisponibles = joueurs.filter(j =>
    j.disponible && !table.joueursAffectes.includes(j.id)
  );

  if (joueursDisponibles.length === 0) {
    alert("Aucun joueur disponible à affecter !");
    return;
  }

  // Créer le modal
  document.getElementById("app").innerHTML += `
    <div id="modal-affectation" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    ">
      <div class="card" style="max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;">
        <h3 style="margin-bottom: 1rem;">Affecter des joueurs à la table n°${table.numero}</h3>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">
          ${table.joueursAffectes.length}/${table.nbJoueurs} joueurs affectés
        </p>

        <div style="margin-bottom: 1rem;">
          <h4>Joueurs disponibles :</h4>
          <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
            ${joueursDisponibles.map(j => `
              <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" id="joueur-${j.id}" value="${j.id}">
                <span>${j.nom}</span>
              </label>
            `).join('')}
          </div>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
          <button onclick="confirmerAffectation('${table.id}')" class="btn-primary" style="flex: 1;">
            ✅ Affecter les joueurs sélectionnés
          </button>
          <button onclick="annulerAffectation()" class="btn-ghost" style="flex: 1;">
            Annuler
          </button>
        </div>
      </div>
    </div>
  `;
}

// Fonction pour confirmer l'affectation
function confirmerAffectation(tableId) {
  const table = tables.find(t => t.id === tableId);
  if (!table) return;

  // Initialiser joueursAffectes si vide
  if (!table.joueursAffectes) {
    table.joueursAffectes = [];
  }

  // Récupérer les joueurs sélectionnés
  const joueursSelectionnes = Array.from(document.querySelectorAll('#modal-affectation input[type="checkbox"]:checked'))
    .map(checkbox => checkbox.value);

  if (joueursSelectionnes.length === 0) {
    alert("Veuillez sélectionner au moins un joueur !");
    return;
  }

  // Vérifier qu'on ne dépasse pas le nombre de joueurs max
  if (table.joueursAffectes.length + joueursSelectionnes.length > table.nbJoueurs) {
    alert(`Vous ne pouvez pas affecter plus de ${table.nbJoueurs} joueurs à cette table !`);
    return;
  }

  // Ajouter les joueurs sélectionnés
  table.joueursAffectes.push(...joueursSelectionnes);
  saveData();
  annulerAffectation();
  renderTables();
  alert(`✅ ${joueursSelectionnes.length} joueur(s) affecté(s) à la table n°${table.numero} !`);
}

// Fonction pour annuler l'affectation
function annulerAffectation() {
  const modal = document.getElementById("modal-affectation");
  if (modal) modal.remove();
  
function deleteTable(id) {
  if (confirm("Êtes-vous sûr de vouloir supprimer cette table ?")) {
    tables = tables.filter(t => t.id !== id);
    saveData();
    renderTables();
  }
}

// ========== INITIALISATION ==========
document.addEventListener('DOMContentLoaded', renderApp);
  
  </script>
</body>
</html>
