<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent3: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem; background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      width: 2.5rem; height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem; display: flex; align-items: center;
      justify-content: center; color: white; font-weight: bold;
    }
    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 1rem; }
    .login-container {
      max-width: 500px; margin: 2rem auto; text-align: center;
      padding: 2rem; background: var(--card-bg); border-radius: 1rem;
      border: 1px solid var(--border);
    }
    .login-icon { font-size: 5rem; margin-bottom: 1rem; }
    .qr-section {
      margin: 1.5rem auto; padding: 1rem; background: var(--bg);
      border-radius: 0.75rem; border: 1px solid var(--border); max-width: 300px;
    }
    .btn {
      padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem;
      font-weight: 600; cursor: pointer; font-size: 0.95rem; width: 100%;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white; margin-top: 1rem;
    }
    .btn-success { background: var(--success); color: white; margin-top: 1rem; }
    .btn-secondary {
      background: var(--border); color: var(--text); margin-top: 1rem;
    }
    .btn-danger { background: var(--accent2); color: white; margin-top: 1rem; }
    .btn-small {
      padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; margin: 0;
    }
    #nav-tabs {
      display: flex; justify-content: center; background: var(--card-bg);
      border-bottom: 1px solid var(--border); padding: 0.5rem 0;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .nav-tab {
      padding: 0.75rem 1.5rem; background: transparent; color: var(--text);
      border: none; border-radius: 0.5rem 0.5rem 0 0; cursor: pointer;
      margin: 0 0.25rem; font-size: 0.9rem;
    }
    .nav-tab.active {
      background: var(--bg); color: var(--accent1);
      border-bottom: 2px solid var(--accent1);
    }
    .nav-tab\:hover { background: rgba(255, 255, 255, 0.05); }
    #logout-btn { background: var(--accent2) !important; color: white !important; }
    input, select {
      width: 100%; padding: 0.75rem; border-radius: 0.5rem;
      border: 1px solid var(--border); background: #0f172a;
      color: var(--text); font-size: 0.95rem; margin: 0.5rem 0;
    }
    label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.25rem; display: block; }
    .error { color: var(--accent2); font-size: 0.85rem; margin: 0.5rem 0; }
    .card {
      background: var(--card-bg); border-radius: 0.75rem; padding: 1rem;
      margin-bottom: 1rem; border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border: 1px solid var(--border); text-align: left; }
    th { background: var(--card-bg); }
    tr\:nth-child(even) { background: var(--bg); }
    .score-positif { color: var(--success); font-weight: bold; }
    .score-negatif { color: var(--accent2); font-weight: bold; }
    .score-zero { color: var(--text-muted); }

    /* Modale plein écran */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 100;
      display: none;
    }
    .modal-overlay.active { display: flex; flex-direction: column; }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem; background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-content {
      max-width: 800px; margin: 0 auto; padding: 1rem;
      flex: 1; overflow-y: auto; width: 100%;
    }
    .cumul-banner {
      background: var(--card-bg); border-radius: 0.75rem; padding: 1rem;
      margin-bottom: 1rem; border: 1px solid var(--accent1);
    }
    .cumul-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.5rem; margin-top: 0.5rem;
    }
    .cumul-item {
      text-align: center; padding: 0.5rem; background: var(--bg);
      border-radius: 0.5rem;
    }
    .cumul-item .nom { font-size: 0.8rem; color: var(--text-muted); }
    .cumul-item .score { font-size: 1.1rem; font-weight: bold; }
