<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent4: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1, h2, h3 {
      margin: 0 0 16px 0;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    .btn-primary {
      background: var(--accent1);
      color: white;
    }
    .btn-success {
      background: var(--accent4);
      color: white;
    }
    .btn-danger {
      background: var(--accent2);
      color: white;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .player-card {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-info {
      flex: 1;
    }
    .player-name {
      font-weight: 600;
      font-size: 16px;
    }
    .player-status {
      font-size: 14px;
      color: var(--text-muted);
    }
    .player-score {
      font-weight: 600;
      font-size: 18px;
    }
    .positive {
      color: var(--accent4);
    }
    .negative {
      color: var(--accent2);
    }
    .qr-code {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .qr-code img {
      border-radius: 12px;
      border: 4px solid var(--border);
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .nav-tab {
      padding: 10px 16px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      font-weight: 600;
    }
    .nav-tab.active {
      background: rgba(139, 92, 246, 0.2);
      color: white;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .user-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent1);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🃏 ABJE Tarot</h1>
      <div id="user-section"></div>
    </header>

    <nav class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-tab="accueil">🏠 Accueil</button>
      <button class="nav-tab" data-tab="joueurs">👥 Joueurs</button>
      <button class="nav-tab" data-tab="tables">🎲 Tables</button>
    </nav>

    <main id="main-content">
      <!-- Le contenu sera chargé dynamiquement ici -->
    </main>
  </div>

  <script>
    // ========== DONNÉES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "j1", nom: "Tarot ABJE", present: true, scoreTotal: 0 },
      { id: "j2", nom: "Joueur 2", present: true, scoreTotal: 0 },
      { id: "j3", nom: "Joueur 3", present: true, scoreTotal: 0 },
      { id: "j4", nom: "Joueur 4", present: true, scoreTotal: 0 }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables));
    }

    // ========== FONCTIONS UTILITAIRES ==========
    function formatDateFR(d) {
      if (typeof d === "string") d = new Date(d);
      return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }

    function getInitials(nom) {
      return nom.split(" ").map(n => n[0].toUpperCase()).join("");
    }

    function formatScore(score) {
      return score >= 0 ? `+${score}` : score;
    }

    // ========== RENDU DES ONGLETS ==========
    function renderLoginScreen() {
      return `
        <div class="card" style="text-align: center;">
          <h1>🃏 ABJE Tarot</h1>
          <form id="login-form" style="margin-top: 20px;">
            <input type="text" id="login" placeholder="Login (admin/abje)" required />
            <input type="password" id="password" placeholder="Mot de passe" required />
            <div id="login-error" style="color: var(--accent2); margin: 10px 0;"></div>
            <button type="submit" class="btn-primary">Se connecter</button>
          </form>
          <p style="margin-top: 20px; font-size: 12px; color: var(--text-muted);">
            Identifiants : admin/${ADMIN_PASSWORD} | abje/${ABJE_PASSWORD}
          </p>
        </div>
      `;
    }

    function renderAccueil() {
      return `
        <div class="card" style="text-align: center;">
          <h2>Bienvenue sur ABJE Tarot !</h2>
          <p>Scannez le QR code pour accéder à l'application depuis votre mobile :</p>
          <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(APP_URL)}&bgcolor=1e293b&color=f8fafc" alt="QR Code ABJE Tarot" width="200" height="200" />
          </div>
          <p><a href="${APP_URL}" target="_blank" style="color: var(--accent4);">${APP_URL}</a></p>
          <button class="btn-ghost" onclick="copyLink()">Copier le lien</button>
        </div>
      `;
    }

    function renderJoueurs() {
      const joueursPresent = joueurs.filter(j => j.present).length;
      return `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>Joueurs (${joueursPresent}/${joueurs.length})</h2>
            ${user?.role === "admin" ? `
              <form onsubmit="addJoueur(event)" style="display: flex; gap: 8px;">
                <input name="nom" type="text" placeholder="Nouveau joueur" style="width: 200px;" />
                <button type="submit" class="btn-success">+ Ajouter</button>
              </form>
            ` : ''}
          </div>
          <div class="player-grid">
            ${joueurs.map(j => `
              <div class="player-card">
                <div class="player-info">
                  <div class="player-name">${j.nom}</div>
                  <div class="player-status">${j.present ? "✅ Présent" : "❌ Absent"}</div>
                </div>
                <div>
                  <span class="player-score ${j.scoreTotal >= 0 ? 'positive' : 'negative'}">${formatScore(j.scoreTotal)}</span>
                  ${user?.role === "admin" ? `
                    <button class="btn-ghost" onclick="togglePresence('${j.id}')" style="padding: 4px 8px; margin-left: 8px;">
                      ${j.present ? "✅" : "❌"}
                    </button>
                    <button class="btn-danger" onclick="deleteJoueur('${j.id}')" style="padding: 4px 8px; margin-left: 4px;">🗑️</button>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTables() {
      return `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>Tables (${tables.length})</h2>
            ${user?.role === "admin" ? `
              <button class="btn-primary" onclick="addTable()">+ Nouvelle table</button>
            ` : ''}
          </div>
          ${tables.length === 0 ? '<p style="color: var(--text-muted);">Aucune table créée.</p>' : `
            ${tables.map(t => `
              <div style="margin-top: 10px; padding: 16px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                  <p style="margin: 0; font-weight: 600;">Table du ${formatDateFR(t.date)}</p>
                  <span style="font-size: 14px; color: var(--text-muted);">${t.nbJoueurs} joueurs · ${t.menes?.length || 0} ménes</span>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  ${t.joueurs?.map(jId => {
                    const j = joueurs.find(j => j.id === jId);
                    return j ? `<span style="padding: 6px 12px; background: var(--card-bg); border-radius: 20px; font-size: 12px; color: var(--text-muted);">${getInitials(j.nom)}</span>` : '';
                  }).join('')}
                </div>
              </div>
            `).join('')}
          `}
        </div>
      `;
    }

    // ========== LOGIQUE ==========
    function login(e) {
      e.preventDefault();
      const login = document.getElementById("login").value;
      const password = document.getElementById("password").value;
      const errorElement = document.getElementById("login-error");

      if (login === "admin" && password === ADMIN_PASSWORD) {
        user = { role: "admin", login: "admin" };
        saveData();
        renderApp();
      } else if (login === "abje" && password === ABJE_PASSWORD) {
        user = { role: "abje", login: "abje" };
        saveData();
        renderApp();
      } else {
        errorElement.textContent = "Login ou mot de passe incorrect";
      }
    }

    function logout() {
      user = null;
      saveData();
      renderApp();
    }

    function addJoueur(e) {
      e.preventDefault();
      const nom = e.target.nom.value.trim();
      if (nom) {
        joueurs.push({ id: Date.now().toString(), nom, present: true, scoreTotal: 0 });
        saveData();
        renderApp();
        e.target.reset();
      }
    }

    function deleteJoueur(id) {
      joueurs = joueurs.filter(j => j.id !== id);
      saveData();
      renderApp();
    }

    function togglePresence(id) {
      joueurs = joueurs.map(j => j.id === id ? { ...j, present: !j.present } : j);
      saveData();
      renderApp();
    }

    function addTable() {
      tables.push({
        id: Date.now().toString(),
        date: new Date().toISOString().split('T')[0],
        nbJoueurs: 4,
        menes: [],
        joueurs: joueurs.slice(0, 4).map(j => j.id)
      });
      saveData();
      renderApp();
    }

    function copyLink() {
      navigator.clipboard.writeText(APP_URL).then(() => alert("Lien copié !"));
    }

    function setActiveTab(tab) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      renderContent(tab);
    }

    function renderContent(tab) {
      const contentMap = {
        accueil: renderAccueil(),
        joueurs: renderJoueurs(),
        tables: renderTables()
      };
      document.getElementById("main-content").innerHTML = contentMap[tab] || renderAccueil();
    }

    function renderUserSection() {
      const userSection = document.getElementById("user-section");
      if (user) {
        userSection.innerHTML = `
          <span class="user-badge">${user.role.toUpperCase()}</span>
          <button class="btn-ghost" onclick="logout()">Déconnexion</button>
        `;
      } else {
        userSection.innerHTML = '';
      }
    }

    function renderApp() {
      if (!user) {
        document.getElementById("main-content").innerHTML = renderLoginScreen();
        document.getElementById("user-section").innerHTML = '';
        document.getElementById("nav-tabs").style.display = "none";
      } else {
        document.getElementById("nav-tabs").style.display = "flex";
        renderUserSection();
        renderContent("accueil");
      }

      // Réattacher les écouteurs d'événements
      document.getElementById("login-form")?.addEventListener("submit", login);
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.onclick = () => setActiveTab(tab.dataset.tab);
      });
    }

    // ========== INITIALISATION ==========
    renderApp();
  </script>
</body>
</html>
