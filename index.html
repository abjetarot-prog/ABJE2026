<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1a1a2e;
      --bg3: #16213e;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent3: #8b5cf6;
      --accent4: #10b981;
      --accent5: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
      --success: #10b981;
      --warn: #f59e0b;
    }
    body {
      margin: 0;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: white;
    }
    .logo-text div:first-child {
      font-size: 18px;
      font-weight: 700;
    }
    .logo-text div:last-child {
      font-size: 11px;
      color: var(--text-muted);
    }
    nav {
      display: flex;
      justify-content: space-around;
      padding: 6px 4px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 60px;
      z-index: 99;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .nav-tab.active {
      color: var(--accent1);
    }
    .nav-tab.active span:first-child {
      transform: scale(1.1);
    }
    main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    h1, h2, h3 {
      margin: 0 0 16px 0;
      font-weight: 700;
    }
    h2 {
      font-size: 22px;
    }
    h3 {
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button:not(:disabled):active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .btn-success {
      background: linear-gradient(135deg, var(--accent4), #059669);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-danger {
      background: var(--error);
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-info {
      background: linear-gradient(135deg, var(--accent5), #2563eb);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn-purple {
      background: linear-gradient(135deg, var(--accent3), #7c3aed);
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      box-sizing: border-box;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent3);
    }
    .error {
      color: var(--error);
      font-size: 14px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .player-card {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .player-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }
    .player-name {
      font-size: 15px;
      font-weight: 600;
    }
    .player-score {
      font-size: 18px;
      font-weight: 800;
    }
    .positive {
      color: var(--accent4);
    }
    .negative {
      color: var(--error);
    }
    .player-status {
      font-size: 12px;
      color: var(--text-muted);
    }
    .qr-code img {
      border-radius: 12px;
      border: 4px solid var(--border);
      margin: 20px auto;
      display: block;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .form-row > div {
      flex: 1;
      min-width: 150px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .table-container {
      overflow-x: auto;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">A</div>
      <div>
        <div>ABJE</div>
        <div id="user-role">Tarot</div>
      </div>
    </div>
    <button id="logout-btn" class="btn-ghost" style="font-size: 13px; padding: 8px 14px;">Déconnexion</button>
  </header>

  <nav id="nav-tabs">
    <button class="nav-tab active" data-tab="accueil">
      <span>🏠</span>
      <span>Accueil</span>
    </button>
    <button class="nav-tab" data-tab="joueurs">
      <span>👥</span>
      <span>Joueurs</span>
    </button>
    <button class="nav-tab" data-tab="tables">
      <span>🎲</span>
      <span>Tables</span>
    </button>
    <button class="nav-tab" data-tab="saisies">
      <span>✏️</span>
      <span>Saisies</span>
    </button>
    <button class="nav-tab" data-tab="resultats">
      <span>🏆</span>
      <span>Résultats</span>
    </button>
  </nav>

  <main id="main-content">
    <!-- Le contenu sera chargé dynamiquement ici -->
  </main>

  <!-- Modals -->
  <div id="login-modal" class="modal active">
    <div class="modal-content">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, var(--accent1), var(--accent2)); margin-bottom: 16px; box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C12 2 8 6 8 10C8 12 9.5 13 12 13C14.5 13 16 12 16 10C16 6 12 2 12 2Z" fill="white" opacity="0.95" />
            <path d="M5 14C5 14 2 16 2 19C2 21 3.5 22 5 22C7 22 8 21 8 19C8 16 5 14 5 14Z" fill="white" opacity="0.8" />
            <path d="M19 14C19 14 16 16 16 19C16 21 17.5 22 19 22C21 22 22 21 22 19C22 16 19 14 19 14Z" fill="white" opacity="0.8" />
            <rect x="10.5" y="12" width="3" height="9" rx="1.5" fill="white" />
          </svg>
        </div>
        <h1 style="font-size: 42px; font-weight: 800; margin: 0; letter-spacing: 4px; background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">ABJE</h1>
        <div style="margin-top: 10px; padding: 8px 16px; border-radius: 12px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); display: inline-flex; align-items: center; gap: 8px;">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent4); animation: pulse 2s infinite;"></span>
          <span id="login-date" style="font-size: 14px; color: var(--text-muted); font-weight: 500; text-transform: capitalize;"></span>
        </div>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; margin-left: 4px;">Login</label>
          <input type="text" id="login" placeholder="Entrez votre identifiant" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; margin-left: 4px;">Mot de passe</label>
          <div style="position: relative;">
            <input type="password" id="password" placeholder="Entrez votre mot de passe" autocomplete="current-password" required />
            <button type="button" id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: var(--text-muted);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="error"></div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 4px;">Se connecter</button>
      </form>
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; background: rgba(139, 92, 246, 0.15);">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent3);"></span>
          Admin · contrôle total
        </div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; background: rgba(16, 185, 129, 0.15);">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent4);"></span>
          ABJE · ajout & modification
        </div>
      </div>
    </div>
  </div>

  <div id="create-table-modal" class="modal">
    <div class="modal-content">
      <h2>Créer une nouvelle table</h2>
      <div class="form-group">
        <label>Nombre de joueurs</label>
        <select id="new-table-nb-joueurs">
          <option value="4">4 joueurs</option>
          <option value="5">5 joueurs</option>
          <option value="6">6 joueurs</option>
          <option value="7">7 joueurs</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sélectionnez les joueurs disponibles</label>
        <div id="new-table-joueurs-select" style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn-primary" onclick="createTable()">Créer la table</button>
        <button class="btn-ghost" onclick="hideCreateTableModal()">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    // ========== CONSTANTES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    const COLORS = {
      bg: "#0f172a",
      bg2: "#1a1a2e",
      bg3: "#16213e",
      cardBg: "#1e293b",
      accent1: "#f59e0b",
      accent2: "#ef4444",
      accent3: "#8b5cf6",
      accent4: "#10b981",
      accent5: "#3b82f6",
      text: "#f8fafc",
      textMuted: "#94a3b8",
      border: "#334155",
      error: "#ef4444",
      success: "#10b981",
      warn: "#f59e0b",
    };

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "j1", nom: "Tarot ABJE", disponible: false },
      { id: "j2", nom: "Joueur 2", disponible: false },
      { id: "j3", nom: "Joueur 3", disponible: false },
      { id: "j4", nom: "Joueur 4", disponible: false }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];
    let menes = JSON.parse(localStorage.getItem("abje_menes")) || {};
    let tableCounter = JSON.parse(localStorage.getItem("abje_tableCounter")) || 0;
    let partiesValidees = JSON.parse(localStorage.getItem("abje_partiesValidees")) || {};

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables));
      localStorage.setItem("abje_menes", JSON.stringify(menes));
      localStorage.setItem("abje_tableCounter", JSON.stringify(tableCounter));
      localStorage.setItem("abje_partiesValidees", JSON.stringify(partiesValidees));
    }

    // ========== FONCTIONS UTILITAIRES ==========
    function formatDateFR(d) {
      if (typeof d === "string") d = new Date(d);
      const opts = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
      return d.toLocaleDateString("fr-FR", opts);
    }

    function dateKey(d) {
      if (typeof d === "string") return d;
      return d.toISOString().split("T")[0];
    }

    function monthKey(d) {
      if (typeof d === "string") d = new Date(d);
      const m = (d.getMonth() + 1).toString().padStart(2, "0");
