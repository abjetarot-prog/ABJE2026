<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ABJE Tarot - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
    }
    input {
      display: block;
      margin: 1rem auto;
      padding: 0.5rem;
      width: 200px;
      border-radius: 0.5rem;
      border: none;
    }
    button {
      padding: 0.5rem 1rem;
      background: #f59e0b;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🃏 ABJE Tarot</h1>
    <form id="loginForm">
      <input type="text" id="login" placeholder="Login" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <div id="loginError" class="error"></div>
      <button type="submit">Se connecter</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").onsubmit = function(e) {
      e.preventDefault();
      const login = document.getElementById("login").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("loginError");

      if ((login === "admin" && password === "Tass6gny") || (login === "abje" && password === "0309")) {
        errorEl.textContent = "";
        alert("Connecté !");
      } else {
        errorEl.textContent = "Login ou mot de passe incorrect";
      }
    };
  </script>
</body>
</html>
