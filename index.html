<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1a1a2e;
      --bg3: #16213e;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent3: #8b5cf6;
      --accent4: #10b981;
      --accent5: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
    }
    body {
      margin: 0;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: white;
    }
    .user-info { font-size: 11px; color: var(--text-muted); }
    nav {
      display: flex; justify-content: space-around; padding: 6px 4px;
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      max-width: 600px; margin: 0 auto; width: 100%;
    }
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 10px; background: transparent; border: none; cursor: pointer;
      font-size: 10px; font-weight: 600; color: var(--text-muted);
    }
    .nav-tab.active { color: var(--accent1); }
    main { flex: 1; padding: 16px; max-width: 600px; width: 100%; margin: 0 auto; }
    .card {
      background: var(--card-bg); border-radius: 16px; padding: 20px;
      border: 1px solid var(--border); margin-bottom: 16px;
    }
    h1, h2, h3 { margin: 0 0 16px 0; font-weight: 700; }
    h2 { font-size: 22px; }
    h3 { font-size: 16px; }
    button {
      padding: 12px 20px; border: none; border-radius: 12px; font-weight: 700;
      cursor: pointer; font-size: 14px; margin: 5px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: white; }
    .btn-success { background: var(--accent4); color: white; }
    .btn-danger { background: var(--accent2); color: white; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-info { background: linear-gradient(135deg, var(--accent5), #2563eb); color: white; }
    input, select {
      width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
      border: 2px solid var(--border); background: var(--bg); color: var(--text);
      outline: none; margin-bottom: 12px;
    }
    input:focus, select:focus { border-color: var(--accent3); }
    .qr-code img {
      border-radius: 12px; border: 4px solid var(--border);
      margin: 20px auto; display: block;
    }
    .error { color: var(--error); margin: 10px 0; }
    .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .player-card {
      background: var(--bg); border-radius: 12px; padding: 16px;
      border: 1px solid var(--border);
    }
    .player-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
    }
    .player-name { font-size: 15px; font-weight: 600; }
    .player-score { font-size: 18px; font-weight: 800; }
    .positive { color: var(--accent4); }
    .negative { color: var(--error); }
    .player-status { font-size: 12px; color: var(--text-muted); }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg); border-radius: 16px; padding: 20px;
      max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <div>
        <div>ABJE</div>
        <div class="user-info">Tarot</div>
      </div>
    </div>
    <button id="logout-btn" class="btn-ghost" style="display: none;">Déconnexion</button>
  </header>

  <nav id="nav-tabs" style="display: none;">
    <button class="nav-tab active" data-tab="accueil"><span>🏠</span> Accueil</button>
    <button class="nav-tab" data-tab="joueurs"><span>👥</span> Joueurs</button>
    <button class="nav-tab" data-tab="tables"><span>🎲</span> Tables</button>
    <button class="nav-tab" data-tab="saisies"><span>✏️</span> Saisies</button>
    <button class="nav-tab" data-tab="resultats"><span>🏆</span> Résultats</button>
  </nav>

  <main id="app"></main>

  <div id="create-table-modal" class="modal">
    <div class="modal-content">
      <h2>Créer une nouvelle table</h2>
      <div class="form-group">
        <label>Nombre de joueurs</label>
        <select id="new-table-nb-joueurs">
          <option value="4">4 joueurs</option>
          <option value="5">5 joueurs</option>
          <option value="6">6 joueurs</option>
          <option value="7">7 joueurs</option>
        </select>
      </div>
      <div class="form-group">
        <label>Joueurs disponibles</label>
        <div id="available-players" style="max-height: 200px; overflow-y: auto;"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn-primary" onclick="createTable()">Créer la table</button>
        <button class="btn-ghost" onclick="hideModal('create-table-modal')">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    // ========== CONSTANTES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "1", nom: "Tarot ABJE", disponible: false, scoreTotal: 0 },
      { id: "2", nom: "Joueur 2", disponible: false, scoreTotal: 0 },
      { id: "3", nom: "Joueur 3", disponible: false, scoreTotal: 0 },
      { id: "4", nom: "Joueur 4", disponible: false, scoreTotal: 0 }
    ];
    let tables = JSON.parse(localStorage.getItem("abje_tables")) || [];
    let menes = JSON.parse(localStorage.getItem("abje_menes")) || {};
    let tableCounter = parseInt(localStorage.getItem("abje_tableCounter") || "0");
    let partiesValidees = JSON.parse(localStorage.getItem("abje_partiesValidees")) || {};

    // ========== SAUVEGARDE ==========
    function saveAllData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
      localStorage.setItem("abje_tables", JSON.stringify(tables));
      localStorage.setItem("abje_menes", JSON.stringify(menes));
      localStorage.setItem("abje_tableCounter", tableCounter);
      localStorage.setItem("abje_partiesValidees", JSON.stringify(partiesValidees));
    }

    // ========== FONCTIONS UTILITAIRES ==========
    function formatDateFR(date) {
      if (typeof date === "string") date = new Date(date);
      return date.toLocaleDateString("fr-FR", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    }

    function dateKey(date) {
      if (typeof date === "string") return date;
      return date.toISOString().split("T")[0];
    }

    function getJoueurById(id) {
      return joueurs.find(j => j.id === id);
    }

    // ========== FONCTIONS DE CALCUL (Règles FFTarot) ==========
    const CONTRATS = {
      "Petite": { mult: 1, label: "Petite" },
      "Garde": { mult: 2, label: "Garde" },
      "Garde sans": { mult: 4, label: "Garde sans" },
      "Garde contre": { mult: 6, label: "Garde contre" }
    };

    const POIGNEES = { "Aucune": 0, "Simple": 20, "Double": 30, "Triple": 40 };

    function getContratsForTable(nbJoueurs) {
      if (nbJoueurs === 4) return ["Petite", "Garde", "Garde sans", "Garde contre"];
      return ["Garde", "Garde sans", "Garde contre"];
    }

    function calculerScore(mene) {
      const contrat = CONTRATS[mene.contrat];
      if (!contrat) return { preneur: 0, defense: 0, details: "Contrat invalide", gagne: false };

      const seuils = { 0: 56, 1: 51, 2: 41, 3: 36 };
      const nbBouts = mene.nbBouts || 0;
      const seuil = seuils[nbBouts] || 56;
      const diff = (mene.pointsRealises || 0) - seuil;

      let base = 25 + diff;
      if (mene.petitAuBout === "preneur") base += 10;
      else if (mene.petitAuBout === "defense") base -= 10;

      let scoreContrat = Math.round((base * contrat.mult) / 10) * 10;
      const poigneePts = POIGNEES[mene.poignee] || 0;
      let bonusPoignee = (mene.poigneeSide === "preneur" ? poigneePts : -poigneePts);
      let bonusChelem = { "aucun": 0, "non_demande": 200, "demande_reussi": 400, "demande_perdu": -400 }[mene.chelem] || 0;

      let scoreTotal = scoreContrat + bonusPoignee + bonusChelem;
      const gagne = diff >= 0;

      const detailParts = [
        `25 + (${mene.pointsRealises || 0} - ${seuil}) = ${base}`,
        `x ${contrat.mult} = ${scoreContrat}`
      ];
      if (mene.petitAuBout !== "aucun") detailParts.push(`Petit bout: ${mene.petitAuBout === "preneur" ? "+10" : "-10"}`);
      if (poigneePts > 0) detailParts.push(`Poignée: ${poigneePts} (${mene.poigneeSide}) ${bonusPoignee > 0 ? "+" : ""}${Math.abs(bonusPoignee)}`);
      if (bonusChelem !== 0) detailParts.push(`Chelem: ${bonusChelem > 0 ? "+" : ""}${Math.abs(bonusChelem)}`);
      detailParts.push(`= ${gagne ? "+" : ""}${Math.abs(scoreTotal)} (${gagne ? "Gagné" : "Perdu"})`);

      return {
        preneur: gagne ? scoreTotal : -scoreTotal,
        defense: gagne ? -scoreTotal : scoreTotal,
        gagne,
        details: detailParts.join(" - "),
        scoreTotal: scoreTotal
      };
    }

    function getScoresParJoueur(mene, nbJoueurs) {
      const result = calculerScore(mene);
      const score = result.scoreTotal;
      const hasAppele = mene.appele && mene.appele !== "aucun";

      const scores = {};
      if (nbJoueurs === 4) {
        if (mene.preneur) scores[mene.preneur] = Math.round(score * 3);
        scores._defense = -Math.round(score);
      } else if (hasAppele) {
        if (mene.preneur) scores[mene.preneur] = Math.round(score * 2);
        if (mene.appele) scores[mene.appele] = Math.round(score);
        scores._defense = -Math.round(score);
      } else {
        if (mene.preneur) scores[mene.preneur] = Math.round(score * (nbJoueurs - 1));
        scores._defense = -Math.round(score);
      }
      return { scores, gagne: result.gagne, details: result.details };
    }

    // ========== RENDU DES ÉCRANS ==========
    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <div style="text-align: center; max-width: 400px; margin: 0 auto;">
          <div style="font-size: 72px; margin-bottom: 16px;">🃏</div>
          <h1 style="font-size: 42px; font-weight: 800; margin: 0; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
            ABJE
          </h1>
          <div style="margin: 16px 0; padding: 8px 16px; border-radius: 12px;
            background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
            display: inline-flex; align-items: center; gap: 8px;">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent4);
              animation: pulse 2s infinite;"></span>
            <span>${formatDateFR(new Date())}</span>
          </div>
          <form id="loginForm" style="margin-top: 20px;">
            <div>
              <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Login</label>
              <input type="text" id="loginInput" placeholder="admin ou abje" required autocomplete="username" />
            </div>
            <div>
              <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Mot de passe</label>
              <input type="password" id="passwordInput" placeholder="Mot de passe" required autocomplete="current-password" />
            </div>
            <div id="loginError" class="error"></div>
            <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
          </form>
        </div>
      `;
      document.getElementById("loginForm").addEventListener("submit", handleLogin);
    }

    function renderAccueil() {
      document.getElementById("app").innerHTML = `
        <div style="text-align: center;">
          <div class="card">
            <div style="font-size: 48px; margin-bottom: 12px;">🃏</div>
            <h2>Bienvenue sur ABJE Tarot !</h2>
            <p>Scannez le QR code pour accéder à l'application depuis votre mobile :</p>
            <div class="qr-code">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(APP_URL)}&bgcolor=1e293b&color=f8fafc"
                   alt="QR Code ABJE Tarot" width="200" />
            </div>
            <p><a href="${APP_URL}" target="_blank" style="color: var(--accent4);">${APP_URL}</a></p>
            <button class="btn-ghost" onclick="copyLink()">Copier le lien</button>
          </div>
          <div class="card">
            <h3>📌 Navigation rapide</h3>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
              <button class="btn-primary" onclick="showTab('joueurs')" style="padding: 16px;">👥 Joueurs</button>
              <button class="btn-primary" onclick="showTab('tables')" style="padding: 16px;">🎲 Tables</button>
              <button class="btn-primary" onclick="showTab('saisies')" style="padding: 16px;">✏️ Saisies</button>
              <button class="btn-primary" onclick="showTab('resultats')" style="padding: 16px;">🏆 Résultats</button>
            </div>
          </div>
        </div>
      `;
    }

    function copyLink() {
      navigator.clipboard.writeText(APP_URL).then(() => alert("Lien copié !"));
    }

    function renderJoueurs() {
      document.getElementById("app").innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>👥 Joueurs (${joueurs.length})</h2>
            <button class="btn-success" onclick="showAddJoueur()">+ Nouveau</button>
          </div>
          <div class="player-grid">
            ${joueurs.map(j => `
              <div class="player-card">
                <div style="display: flex; align-items: center; gap: 12px;">
                  <div class="player-avatar" style="background: ${j.disponible ? 'rgba(16, 185, 129, 0.3)' : 'rgba(139, 92, 246, 0.2)'};
                    border: 2px solid ${j.disponible ? 'var(--accent4)' : 'var(--accent3)'};">
                    ${(j.nom || "?")[0].toUpperCase()}
                  </div>
                  <div>
                    <div class="player-name">${j.nom}</div>
                    <div class="player-status">${j.disponible ? "✅ Disponible" : "❌ Non disponible"}</div>
                  </div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="btn-ghost" onclick="toggleDisponible('${j.id}')" style="padding: 4px 8px; font-size: 12px;">
                    ${j.disponible ? "Retirer" : "Ajouter"}
                  </button>
                  <button class="btn-danger" onclick="deleteJoueur('${j.id}')" style="padding: 4px 8px;">×</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTables() {
      const today = dateKey(new Date());
      const tablesDuJour = tables.filter(t => t.date === today);

      document.getElementById("app").innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>🎲 Tables du jour (${tablesDuJour.length})</h2>
            <div style="display: flex; gap: 8px;">
              <button class="btn-ghost" onclick="decocherTousPresents()" style="font-size: 12px; padding: 6px 12px;">2e tour</button>
              <button class="btn-primary" onclick="showCreateTableModal()">+ Nouvelle table</button>
            </div>
          </div>

          <div class="card">
            <h3>Joueurs disponibles aujourd'hui</h3>
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
              <button class="btn-ghost" onclick="cocherTousPresents()" style="font-size: 12px; padding: 6px 12px;">✅ Tout cocher</button>
              <button class="btn-ghost" onclick="decocherTousPresents()" style="font-size: 12px; padding: 6px 12px;">☐ Tout décocher</button>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              ${joueurs.map(j => `
                <div style="padding: 6px 12px; background: var(--bg); border-radius: 20px; border: 1px solid var(--border);
                  cursor: pointer; ${j.disponible ? 'background: rgba(16, 185, 129, 0.2); border-color: var(--accent4);' : ''}"
                  onclick="toggleDisponible('${j.id}')">
                  ${j.nom} ${j.disponible ? '✅' : '❌'}
                </div>
              `).join('')}
            </div>
          </div>

          <div>
            <h3>Tables créées</h3>
            ${tablesDuJour.length === 0 ? `
              <div class="card" style="text-align: center;">
                <p style="color: var(--text-muted);">Aucune table créée aujourd'hui.</p>
              </div>
            ` : `
              ${tablesDuJour.map(table => `
                <div class="card">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div>
                      <h3 style="margin: 0; font-size: 16px;">Table n°${table.numero} (${table.nbJoueurs} joueurs)</h3>
                      <div style="font-size: 12px; color: var(--text-muted);">
                        ${table.joueursAffectes ? table.joueursAffectes.length : 0}/${table.nbJoueurs} joueurs
                      </div>
                    </div>
                    <div>
                      ${table.complete ? `
                        <span style="padding: 4px 10px; background: rgba(16, 185, 129, 0.2); border-radius: 20px; font-size: 12px; color: var(--accent4);">✅ Complète</span>
                      ` : `
                        <button class="btn-info" onclick="showAffectationModal('${table.id}')" style="padding: 6px 12px; font-size: 12px;">Affecter</button>
                        <button class="btn-danger" onclick="deleteTable('${table.id}')" style="padding: 6px 12px; font-size: 12px; margin-left: 4px;">×</button>
                      `}
                    </div>
                  </div>
                  ${table.joueursAffectes && table.joueursAffectes.length > 0 ? `
                    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;">
                      ${table.joueursAffectes.map(joueurId => {
                        const j = getJoueurById(joueurId);
                        return j ? `<span style="padding: 4px 10px; background: var(--bg); border-radius: 16px; border: 1px solid var(--border); font-size: 12px;">${j.nom[0].toUpperCase()}</span>` : '';
                      }).join('')}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            `}
          </div>
        </div>
      `;
    }

    function renderSaisies() {
      const today = dateKey(new Date());
      const tablesDuJour = tables.filter(t => t.date === today && t.complete);

      document.getElementById("app").innerHTML = `
        <div>
          <h2>✏️ Saisies</h2>
          ${tablesDuJour.length === 0 ? `
            <div class="card" style="text-align: center;">
              <p style="color: var(--text-muted);">Aucune table complète aujourd'hui.</p>
            </div>
          ` : `
            <div style="display: flex; flex-direction: column; gap: 12px;">
              ${tablesDuJour.map(table => {
                const tableMenes = menes[table.id] || [];
                const isValidee = partiesValidees[table.id];
                return `
                  <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                      <div>
                        <h3 style="margin: 0; font-size: 16px;">Table n°${table.numero}</h3>
                        <div style="font-size: 12px; color: var(--text-muted);">
                          ${tableMenes.length} mène${tableMenes.length > 1 ? 's' : ''} saisie${tableMenes.length > 1 ? 's' : ''}
                        </div>
                      </div>
                      <div>
                        ${isValidee ? `
                          <span style="padding: 4px 10px; background: rgba(16, 185, 129, 0.2); border-radius: 20px; font-size: 12px; color: var(--accent4);">✅ Validée</span>
                        ` : `
                          <button class="btn-info" onclick="showSaisieModal('${table.id}')" style="padding: 6px 12px; font-size: 12px;">Saisir</button>
                        `}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderResultats() {
      const scores = {};
      joueurs.forEach(j => { scores[j.id] = { total: 0, nom: j.nom }; });

      tables.forEach(table => {
        const tableMenes = menes[table.id] || [];
        tableMenes.forEach(mene => {
          const result = calculerScore(mene);
          const score = result.preneur;
          const nbJ = table.nbJoueurs;
          const hasAppele = mene.appele && mene.appele !== "aucun";

          if (nbJ === 4) {
            scores[mene.preneur].total += Math.round(score * 3);
            table.joueursAffectes.forEach(id => {
              if (id !== mene.preneur) scores[id].total -= Math.round(score);
            });
          } else if (hasAppele) {
            scores[mene.preneur].total += Math.round(score * 2);
            scores[mene.appele].total += Math.round(score);
            table.joueursAffectes.forEach(id => {
              if (id !== mene.preneur && id !== mene.appele) scores[id].total -= Math.round(score);
            });
          } else {
            scores[mene.preneur].total += Math.round(score * (nbJ - 1));
            table.joueursAffectes.forEach(id => {
              if (id !== mene.preneur) scores[id].total -= Math.round(score);
            });
          }
        });
      });

      const classement = Object.values(scores).sort((a, b) => b.total - a.total);

      document.getElementById("app").innerHTML = `
        <div>
          <h2>🏆 Classement</h2>
          <div class="card">
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${classement.map((score, index) => {
                const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : index + 1;
                const isPositive = score.total > 0;
                const isZero = score.total === 0;
                return `
                  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);">
                    <span style="font-size: 20px; width: 30px; text-align: center; font-weight: 800;">${medal}</span>
                    <div style="flex: 1;">
                      <div style="font-weight: 600;">${score.nom}</div>
                    </div>
                    <div style="font-size: 18px; font-weight: 800; color: ${isZero ? 'var(--text-muted)' : isPositive ? 'var(--accent4)' : 'var(--error)'};">
                      ${score.total > 0 ? '+' : ''}${score.total}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ========== MODALES ==========
    function showModal(modalId) {
      document.getElementById(modalId).classList.add('active');
    }

    function hideModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function showAddJoueur() {
      const nom = prompt("Nom du nouveau joueur :");
      if (nom && nom.trim()) {
        joueurs.push({ id: Date.now().toString(), nom: nom.trim(), disponible: false, scoreTotal: 0 });
        saveAllData();
        renderJoueurs();
      }
    }

    function showCreateTableModal() {
      const disponibles = joueurs.filter(j => j.disponible);
      if (disponibles.length < 4) {
        alert("Il faut au moins 4 joueurs disponibles pour créer une table.");
        return;
      }

      document.getElementById("new-table-nb-joueurs").value = "4";
      const html = disponibles.map(j => `
        <label style="display: flex; align-items: center; gap: 8px; padding: 6px; cursor: pointer;">
          <input type="checkbox" value="${j.id}" checked />
          <span>${j.nom}</span>
        </label>
      `).join('');
      document.getElementById("available-players").innerHTML = html;
      showModal("create-table-modal");
    }

    function createTable() {
      const nbJoueurs = parseInt(document.getElementById("new-table-nb-joueurs").value);
      const selectedJoueurs = [];
      document.querySelectorAll("#available-players input[type='checkbox']:checked").forEach(cb => {
        selectedJoueurs.push(cb.value);
      });

      if (selectedJoueurs.length !== nbJoueurs) {
        alert(`Veuillez sélectionner exactement ${nbJoueurs} joueurs.`);
        return;
      }

      tableCounter++;
      tables.push({
        id: Date.now().toString(),
        numero: tableCounter,
        date: dateKey(new Date()),
        nbJoueurs: nbJoueurs,
        joueursAffectes: selectedJoueurs,
        complete: true
      });
      saveAllData();
      hideModal("create-table-modal");
      renderTables();
    }

    function showSaisieModal(tableId) {
      const table = tables.find(t => t.id === tableId);
      if (!table) return;

      const html = `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <h3>Nouvelle mène pour la table n°${table.numero}</h3>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Preneur</label>
            <select id="mene-preneur">
              <option value="">-- Sélectionnez --</option>
              ${table.joueursAffectes.map(jid => {
                const j = getJoueurById(jid);
                return j ? `<option value="${jid}">${j.nom}</option>` : '';
              }).join('')}
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Contrat</label>
            <select id="mene-contrat">
              ${getContratsForTable(table.nbJoueurs).map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Points réalisés</label>
            <input type="number" id="mene-points" placeholder="0" min="0" />
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Petit au bout</label>
            <select id="mene-petit">
              <option value="aucun">Aucun</option>
              <option value="preneur">Preneur</option>
              <option value="defense">Défense</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Poignée</label>
            <select id="mene-poignee">
              <option value="Aucune">Aucune</option>
              <option value="Simple">Simple (+20)</option>
              <option value="Double">Double (+30)</option>
              <option value="Triple">Triple (+40)</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Côté poignée</label>
            <select id="mene-poignee-side">
              <option value="preneur">Preneur</option>
              <option value="defense">Défense</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Chelem</label>
            <select id="mene-chelem">
              <option value="aucun">Aucun</option>
              <option value="non_demande">Non demandé (+200)</option>
              <option value="demande_reussi">Demandé réussi (+400)</option>
              <option value="demande_perdu">Demandé perdu (-400)</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Nombre de bouts</label>
            <select id="mene-nb-bouts">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>
          ${table.nbJoueurs > 4 ? `
            <div>
              <label style="display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px;">Appelé</label>
              <select id="mene-appele">
                <option value="aucun">Aucun</option>
                ${table.joueursAffectes.map(jid => {
                  const j = getJoueurById(jid);
                  return j ? `<option value="${jid}">${j.nom}</option>` : '';
                }).join('')}
              </select>
            </div>
          ` : ''}
          <div id="mene-preview" style="margin-top: 16px; padding: 12px; background: var(--bg); border-radius: 8px; font-size: 12px; color: var(--text-muted);">
            Aperçu du score apparaîtra ici.
          </div>
          <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button class="btn-success" onclick="saveMene('${table.id}')">Valider</button>
            <button class="btn-ghost" onclick="hideModal('saisie-mene-modal')">Annuler</button>
          </div>
        </div>
      `;
      document.getElementById("saisie-mene-form").innerHTML = html;
      document.getElementById("saisie-mene-title").textContent = `Nouvelle mène pour la table n°${table.numero}`;

      const inputs = ["mene-preneur", "mene-contrat", "mene-points", "mene-petit", "mene-poignee", "mene-poignee-side", "mene-chelem", "mene-nb-bouts"];
      if (table.nbJoueurs > 4) inputs.push("mene-appele");
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', () => previewMene(table.nbJoueurs));
      });

      showModal("saisie-mene-modal");
    }

    function previewMene(nbJoueurs) {
      const preneur = document.getElementById("mene-preneur").value;
      const contrat = document.getElementById("mene-contrat").value;
      const points = parseFloat(document.getElementById("mene-points").value) || 0;
      const petit = document.getElementById("mene-petit").value;
      const poignee = document.getElementById("mene-poignee").value;
      const poigneeSide = document.getElementById("mene-poignee-side").value;
      const chelem = document.getElementById("mene-chelem").value;
      const nbBouts = parseInt(document.getElementById("mene-nb-bouts").value) || 0;
      const appele = nbJoueurs > 4 ? document.getElementById("mene-appele").value : "aucun";

      if (!preneur || !contrat) {
        document.getElementById("mene-preview").textContent = "Remplissez au moins le preneur et le contrat.";
        return;
      }

      const testMene = { preneur, contrat, pointsRealises: points, petitAuBout: petit, poignee, poigneeSide, chelem, nbBouts, appele };
      const { scores, gagne, details } = getScoresParJoueur(testMene, nbJoueurs);

      let previewHtml = `<strong>Aperçu:</strong><br>${details}<br><br><strong>Scores:</strong><br>`;
      Object.entries(scores).forEach(([id, score]) => {
        if (id.startsWith('_')) return;
        const j = getJoueurById(id);
        if (j) previewHtml += `${j.nom}: ${score >= 0 ? '+' : ''}${score}<br>`;
      });

      if (scores._defense !== undefined) {
        const nbDefense = scores._nbDefense || (nbJoueurs - (appele !== "aucun" ? 2 : 1));
        previewHtml += `Défense (${nbDefense} joueurs): ${scores._defense >= 0 ? '+' : ''}${scores._defense} chacun`;
      }

      document.getElementById("mene-preview").innerHTML = previewHtml;
    }

    function saveMene(tableId) {
      const table = tables.find(t => t.id === tableId);
      if (!table) return;

      const preneur = document.getElementById("mene-preneur").value;
      const contrat = document.getElementById("mene-contrat").value;
      const points = parseFloat(document.getElementById("mene-points").value) || 0;
      const petit = document.getElementById("mene-petit").value;
      const poignee = document.getElementById("mene-poignee").value;
      const poigneeSide = document.getElementById("mene-poignee-side").value;
      const chelem = document.getElementById("mene-chelem").value;
      const nbBouts = parseInt(document.getElementById("mene-nb-bouts").value) || 0;
      const appele = table.nbJoueurs > 4 ? document.getElementById("mene-appele").value : "aucun";

      if (!preneur || !contrat) {
        alert("Veuillez remplir au moins le preneur et le contrat.");
        return;
      }

      const mene = {
        id: Date.now().toString(),
        preneur, contrat, pointsRealises: points, petitAuBout: petit,
        poignee, poigneeSide, chelem, nbBouts, appele, timestamp: Date.now()
      };

      if (!menes[tableId]) menes[tableId] = [];
      menes[tableId].push(mene);
      saveAllData();
      hideModal("saisie-mene-modal");
      renderSaisies();
    }

    // ========== FONCTIONS DE GESTION ==========
    function toggleDisponible(joueurId) {
      joueurs = joueurs.map(j => j.id === joueurId ? { ...j, disponible: !j.disponible } : j);
      saveAllData();
      if (document.getElementById("app").innerHTML.includes("Joueurs")) renderJoueurs();
      else renderTables();
    }

    function cocherTousPresents() {
      joueurs = joueurs.map(j => ({ ...j, disponible: true }));
      saveAllData();
      renderTables();
    }

    function decocherTousPresents() {
      joueurs = joueurs.map(j => ({ ...j, disponible: false }));
      tables = tables.map(t => ({ ...t, joueursAffectes: [], complete: false }));
      saveAllData();
      renderTables();
    }

    function deleteJoueur(joueurId) {
      if (confirm("Supprimer ce joueur ?")) {
        joueurs = joueurs.filter(j => j.id !== joueurId);
        saveAllData();
        renderJoueurs();
      }
    }

    function deleteTable(tableId) {
      if (confirm("Supprimer cette table ?")) {
        tables = tables.filter(t => t.id !== tableId);
        delete menes[tableId];
        delete partiesValidees[tableId];
        saveAllData();
        renderTables();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const login = document.getElementById("loginInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const errorEl = document.getElementById("loginError");

      if (login.toLowerCase() === "admin" && password === ADMIN_PASSWORD) {
        user = { role: "admin" };
        errorEl.textContent = "";
        saveAllData();
        showApp();
      } else if (login.toLowerCase() === "abje" && password === ABJE_PASSWORD) {
        user = { role: "abje" };
        errorEl.textContent = "";
        saveAllData();
        showApp();
      } else {
        errorEl.textContent = "Login ou mot de passe incorrect";
      }
    }

    function logout() {
      user = null;
      saveAllData();
      renderLogin();
      document.getElementById("nav-tabs").style.display = "none";
      document.getElementById("logout-btn").style.display = "none";
      document.getElementById("user-info").textContent = "Tarot";
    }

    function showApp() {
      document.getElementById("nav-tabs").style.display = "flex";
      document.getElementById("logout-btn").style.display = "block";
      document.getElementById("logout-btn").onclick = logout;
      document.getElementById("user-info").textContent = `${user.role === "admin" ? "Admin" : "ABJE"} · ${formatDateFR(new Date())}`;
      showTab("accueil");
    }

    function showTab(tab) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

      const tabFunctions = {
        accueil: renderAccueil,
        joueurs: renderJoueurs,
        tables: renderTables,
        saisies: renderSaisies,
        resultats: renderResultats
      };

      if (tabFunctions[tab]) tabFunctions[tab]();
    }

    // ========== INITIALISATION ==========
    if (!user) {
      renderLogin();
      document.getElementById("nav-tabs").style.display = "none";
      document.getElementById("logout-btn").style.display = "none";
    } else {
      showApp();
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => showTab(tab.dataset.tab));
    });
  </script>
</body>
</html>
