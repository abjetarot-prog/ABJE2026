<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot - Gestion de Club</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1a1a2e;
      --bg3: #16213e;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --accent3: #8b5cf6;
      --accent4: #10b981;
      --accent5: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
    }

    nav {
      display: flex;
      justify-content: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0;
      position: sticky;
      top: 60px;
      z-index: 99;
    }

    .nav-tab {
      flex: 1;
      max-width: 120px;
      padding: 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .nav-tab:hover {
      color: var(--text);
    }

    .nav-tab.active {
      color: var(--accent1);
      border-bottom: 2px solid var(--accent1);
    }

    .nav-tab span:first-child {
      font-size: 1.25rem;
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }

    h1, h2, h3 {
      margin: 0 0 1rem 0;
      color: var(--text);
      font-weight: 700;
    }

    h1 {
      font-size: 1.75rem;
    }

    h2 {
      font-size: 1.5rem;
    }

    h3 {
      font-size: 1.25rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      margin: 0.25rem;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-success {
      background: var(--accent4);
      color: white;
    }

    .btn-danger {
      background: var(--accent2);
      color: white;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-info {
      background: linear-gradient(135deg, var(--accent5), #2563eb);
      color: white;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      margin: 0.5rem 0;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent3);
    }

    .qr-code {
      text-align: center;
      margin: 1rem 0;
    }

    .qr-code img {
      border-radius: 0.75rem;
      border: 4px solid var(--border);
      max-width: 200px;
      margin: 0 auto;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .player-card {
      background: var(--bg);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-info {
      flex: 1;
    }

    .player-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .player-status {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .player-score {
      font-weight: 700;
      font-size: 1.25rem;
    }

    .positive {
      color: var(--accent4);
    }

    .negative {
      color: var(--accent2);
    }

    .error {
      color: var(--accent2);
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .form-row > div {
      flex: 1;
      min-width: 150px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @media (max-width: 600px) {
      .nav-tab {
        font-size: 0.75rem;
        padding: 0.25rem;
      }
      .nav-tab span:first-child {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <span>ABJE Tarot</span>
    </div>
    <button id="logout-btn" class="btn-ghost" style="display: none;">Déconnexion</button>
  </header>

  <nav id="nav-tabs" style="display: none;">
    <button class="nav-tab active" data-tab="accueil"><span>🏠</span> Accueil</button>
    <button class="nav-tab" data-tab="joueurs"><span>👥</span> Joueurs</button>
    <button class="nav-tab" data-tab="tables"><span>🎲</span> Tables</button>
    <button class="nav-tab" data-tab="saisie"><span>✏️</span> Saisie</button>
    <button class="nav-tab" data-tab="resultats"><span>🏆</span> Résultats</button>
  </nav>

  <main id="app"></main>

  <!-- Modals -->
  <div id="create-table-modal" class="modal">
    <div class="modal-content">
      <h2>Créer une nouvelle table</h2>
      <div class="form-group">
        <label>Nombre de joueurs</label>
        <select id="new-table-nb-joueurs">
          <option value="4">4 joueurs</option>
          <option value="5">5 joueurs</option>
          <option value="6">6 joueurs</option>
          <option value="7">7 joueurs</option>
        </select>
      </div>
      <div class="form-group">
        <label>Joueurs disponibles</label>
        <div id="available-players" style="max-height: 200px; overflow-y: auto;"></div>
      </div>
      <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <button class="btn-primary" onclick="createTable()">Créer la table</button>
        <button class="btn-ghost" onclick="hideModal('create-table-modal')">Annuler</button>
      </div>
    </div>
  </div>

  <div id="saisie-mene-modal" class="modal">
    <div class="modal-content">
      <h2 id="saisie-mene-title">Nouvelle mène</h2>
      <form id="saisieMeneForm">
        <!-- Les champs seront ajoutés dynamiquement par JavaScript -->
      </form>
    </div>
  </div>
