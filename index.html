<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABJE Tarot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent1: #f59e0b;
      --accent2: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    h1, h2, h3 {
      margin: 0 0 1rem 0;
      color: var(--text);
      font-weight: 700;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin: 0.5rem 0;
    }
    .error {
      color: var(--accent2);
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
    }
    .login-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  </header>
<nav id="nav-tabs" style="display: none;">

  <button class="nav-tab" data-tab="tables" onclick="showTab('tables')">🎲 Tables</button>
  <button class="nav-tab" data-tab="saisie" onclick="showTab('saisie')">✏️ Saisie</button>
  <button class="nav-tab" data-tab="resultats" onclick="showTab('resultats')">🏆 Résultats</button>
</nav>
  
  <main id="app">

  </main>

  <script>
    // ========== CONSTANTES ==========
    const ADMIN_PASSWORD = "Tass6gny";
    const ABJE_PASSWORD = "0309";
    const APP_URL = "https://abjetarot-prog.github.io/ABJE2026/";

    // ========== DONNÉES ==========
    let user = JSON.parse(localStorage.getItem("abje_user")) || null;
    let joueurs = JSON.parse(localStorage.getItem("abje_joueurs")) || [
      { id: "1", nom: "Tarot ABJE", disponible: false },
      { id: "2", nom: "Joueur 2", disponible: false },
      { id: "3", nom: "Joueur 3", disponible: false },
      { id: "4", nom: "Joueur 4", disponible: false }
    ];

    // ========== SAUVEGARDE ==========
    function saveData() {
      localStorage.setItem("abje_user", JSON.stringify(user));
      localStorage.setItem("abje_joueurs", JSON.stringify(joueurs));
    }

    // ========== RENDU ==========
    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <div class="login-container">
          <div class="login-icon">🃏</div>
          <h1>ABJE Tarot</h1>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Gestion de club de Tarot</p>
          <form id="loginForm">
            <input type="text" id="login" placeholder="Login (admin/abje)" required autocomplete="username">
            <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
            <div id="loginError" class="error"></div>
            <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = function(e) {
        e.preventDefault();
        const login = document.getElementById("login").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("loginError");

        if ((login === "admin" && password === ADMIN_PASSWORD) || (login === "abje" && password === ABJE_PASSWORD)) {
          user = { role: login };
          errorEl.textContent = "";
          saveData();
          renderApp();
        } else {
          errorEl.textContent = "Login ou mot de passe incorrect";
        }
      };
    }

  function renderApp() {
  if (!user) {
    renderLogin();
    document.getElementById("nav-tabs").style.display = "none";
    document.getElementById("logout-btn").style.display = "none";

}

      <div style="text-align: center; padding: 2rem;">
        <h2>Bienvenue sur ABJE Tarot !</h2>
        <p>Connecté en tant que ${user.role}</p>
        <button onclick="user=null;saveData();renderApp();"
                style="padding: 0.5rem 1rem; background: #334155; border: none; border-radius: 0.5rem; color: white; cursor: pointer;">
          Déconnexion
        </button>
      </div>
    `;
    if (document.getElementById("nav-tabs")) {
      document.getElementById("nav-tabs").style.display = "flex";
    }
    if (document.getElementById("logout-btn")) {
      document.getElementById("logout-btn").style.display = "block";
    }
  }
}
    renderContent("accueil"); // Affiche le contenu de l'onglet Accueil
  }
}

          <div class="card" style="text-align: center;">
            <h2>Bienvenue sur ABJE Tarot !</h2>
            <p>Connecté en tant que ${user.role}</p>
            <button onclick="showTab('joueurs')" class="btn-primary">Aller aux joueurs</button>
          </div>
        `;
      }
    }
// Fonction pour changer d'onglet
function showTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  renderContent(tab);
}

// Fonction pour rendre le contenu de l'onglet
function renderContent(tab) {
  const contentMap = {
    accueil: renderAccueil,
    joueurs: renderJoueurs,
    tables: renderTables,
    saisie: renderSaisie,
    resultats: renderResultats
  };
  contentMap[tab]();
}

// Fonction pour l'onglet Accueil (avec QR code)
function renderAccueil() {
  document.getElementById("app").innerHTML = `
    <div class="card" style="text-align: center;">
      <h2>Bienvenue sur ABJE Tarot !</h2>
      <p>Connecté en tant que ${user.role}</p>
      <p>Scannez le QR code pour accéder depuis votre mobile :</p>
      <div class="qr-code">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(APP_URL)}&bgcolor=1e293b&color=f8fafc" alt="QR Code" width="200">
      </div>
      <p><a href="${APP_URL}" style="color: var(--accent4);" target="_blank">${APP_URL}</a></p>
      <button onclick="navigator.clipboard.writeText('${APP_URL}').then(() => alert('Lien copié !'))" class="btn-ghost">Copier le lien</button>
    </div>
  `;
}

// Fonction pour l'onglet Joueurs
function renderJoueurs() {
  document.getElementById("app").innerHTML = `
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>👥 Joueurs (${joueurs.length})</h2>
        <button onclick="showAddJoueur()" class="btn-success">+ Nouveau</button>
      </div>
      <div class="player-grid">
        ${joueurs.map(j => `
          <div class="player-card">
            <div>
              <div class="player-name">${j.nom}</div>
              <div class="player-status">${j.disponible ? "✅ Disponible" : "❌ Non disponible"}</div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button onclick="toggleDispo('${j.id}')" class="btn-ghost" style="padding: 0.25rem;">${j.disponible ? "Retirer" : "Ajouter"}</button>
              <button onclick="deleteJoueur('${j.id}')" class="btn-danger" style="padding: 0.25rem;">×</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Fonctions pour gérer les joueurs
function showAddJoueur() {
  const nom = prompt("Nom du nouveau joueur :");
  if (nom && nom.trim()) {
    joueurs.push({ id: Date.now().toString(), nom: nom.trim(), disponible: false });
    saveData();
    renderJoueurs();
  }
}

function toggleDispo(id) {
  joueurs = joueurs.map(j => j.id === id ? { ...j, disponible: !j.disponible } : j);
  saveData();
  renderJoueurs();
}

function deleteJoueur(id) {
  if (confirm("Supprimer ce joueur ?")) {
    joueurs = joueurs.filter(j => j.id !== id);
    saveData();
    renderJoueurs();
  }
}

}

function renderResultats() {
