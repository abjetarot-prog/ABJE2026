<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABJE Tarot</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [user, setUser] = useState(null);

        if (!user) {
          return (
            <div style={{ padding: "20px", textAlign: "center", minHeight: "100vh", display: "flex", flexDirection: "column", justifyContent: "center" }}>
              <h1>🃏 ABJE Tarot</h1>
              <div style={{ margin: "20px" }}>
                <button
                  onClick={() => setUser("admin")}
                  style={{
                    padding: "12px 24px",
                    background: "#f59e0b",
                    border: "none",
                    borderRadius: "8px",
                    color: "white",
                    fontWeight: "bold",
                    cursor: "pointer",
                    margin: "5px",
                    fontSize: "16px"
                  }}
                >
                  Se connecter (Admin)
                </button>
                <button
                  onClick={() => setUser("abje")}
                  style={{
                    padding: "12px 24px",
                    background: "#10b981",
                    border: "none",
                    borderRadius: "8px",
                    color: "white",
                    fontWeight: "bold",
                    cursor: "pointer",
                    margin: "5px",
                    fontSize: "16px"
                  }}
                >
                  Se connecter (ABJE)
                </button>
              </div>
              <p style={{ fontSize: "14px", color: "#94a3b8" }}>Mots de passe : admin/Tass6gny | abje/0309</p>
            </div>
          );
        }

        return (
          <div style={{ padding: "20px", minHeight: "100vh" }}>
            <h1>Bienvenue, {user} !</h1>
            <p>Votre application ABJE Tarot est prête.</p>
            <button
              onClick={() => setUser(null)}
              style={{
                padding: "10px 20px",
                background: "#ef4444",
                border: "none",
                borderRadius: "8px",
                color: "white",
                cursor: "pointer",
                fontSize: "14px"
              }}
            >
              Déconnexion
            </button>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
